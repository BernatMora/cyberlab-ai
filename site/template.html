<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bernat CyberLab AI</title>
<meta name="description" content="Llibre viu del Bernat CyberLab: laboratori personal de ciberseguretat. Llegiu-lo on vulgueu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --c-bg:      #0d1117;
    --c-bg-2:    #161b22;
    --c-paper:   #0d1117;
    --c-ink:     #e6edf3;
    --c-ink-2:   #8b949e;
    --c-line:    #30363d;
    --c-accent:  #58a6ff;
    --c-accent2: #3fb950;
    --c-warn:    #d29922;
    --shadow:    0 1px 0 rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.4);
    --radius:    6px;
    --sidebar-w: 300px;
    --reading-max: 780px;
  }
  *,*::before,*::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--c-bg); color: var(--c-ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px; line-height: 1.65;
  }
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

  .sidebar {
    background: var(--c-bg-2); border-right: 1px solid var(--c-line);
    position: sticky; top: 0; align-self: start;
    height: 100vh; overflow-y: auto;
    padding: 22px 18px 32px;
  }
  .brand { font-size: 20px; font-weight: 600; color: var(--c-accent); margin: 0 0 4px; }
  .brand-sub { font-size: 11.5px; color: var(--c-ink-2); margin: 0 0 16px; letter-spacing: 0.03em; }
  .search { width: 100%; padding: 8px 12px; border: 1px solid var(--c-line); border-radius: var(--radius); font: inherit; font-size: 14px; background: var(--c-bg); color: var(--c-ink); }
  .nav { list-style: none; padding: 0; margin: 18px 0 0; }
  .nav-cat { margin: 0 0 4px; }
  .nav-cat-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; color: var(--c-accent); padding: 8px; border-radius: var(--radius); text-align: left; }
  .nav-cat-btn:hover { background: var(--c-bg); }
  .nav-cat-btn .ct { margin-left: auto; font-size: 11px; color: var(--c-ink-2); background: var(--c-paper); padding: 1px 7px; border-radius: 10px; border: 1px solid var(--c-line); }
  .nav-items { list-style: none; padding: 0 0 6px 24px; margin: 0; }
  .nav-items.collapsed { display: none; }
  .nav-item { display: block; padding: 5px 8px; font-size: 13.5px; color: var(--c-ink-2); border-radius: 4px; text-decoration: none; }
  .nav-item:hover { background: var(--c-bg); color: var(--c-ink); }
  .nav-item.active { background: var(--c-accent); color: var(--c-bg); font-weight: 500; }

  .topbar { display: flex; align-items: center; gap: 14px; padding: 14px 32px; background: var(--c-bg-2); border-bottom: 1px solid var(--c-line); position: sticky; top: 0; z-index: 10; }
  .crumbs { font-size: 13px; color: var(--c-ink-2); flex: 1; }
  .crumbs a { color: var(--c-ink-2); text-decoration: none; }
  .crumbs .sep { margin: 0 6px; color: var(--c-line); }

  .reader { max-width: var(--reading-max); margin: 0 auto; padding: 36px 32px 96px; }
  .reader-inner { background: var(--c-paper); border: 1px solid var(--c-line); border-radius: var(--radius); padding: 36px 44px 44px; box-shadow: var(--shadow); }
  .doc h1, .doc h2, .doc h3 { color: var(--c-accent); line-height: 1.25; }
  .doc h1 { font-size: 30px; font-weight: 600; margin: 0 0 16px; padding-bottom: 12px; border-bottom: 2px solid var(--c-accent2); }
  .doc h2 { font-size: 22px; font-weight: 600; margin: 36px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--c-line); }
  .doc h3 { font-size: 17px; font-weight: 600; margin: 26px 0 8px; }
  .doc p { margin: 0 0 14px; }
  .doc ul, .doc ol { margin: 0 0 14px; padding-left: 24px; }
  .doc a { color: var(--c-accent); text-decoration: none; }
  .doc a:hover { text-decoration: underline; }
  .doc blockquote { margin: 16px 0; padding: 10px 16px; border-left: 3px solid var(--c-warn); background: var(--c-bg-2); border-radius: 0 var(--radius) var(--radius) 0; }
  .doc code { font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: var(--c-bg-2); padding: 1px 5px; border-radius: 3px; color: #ff7b72; }
  .doc pre { background: #010409; color: #e6edf3; padding: 14px 18px; border-radius: var(--radius); overflow-x: auto; font-size: 13px; border: 1px solid var(--c-line); }
  .doc pre code { background: transparent; color: inherit; padding: 0; }
  .doc table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
  .doc th, .doc td { border: 1px solid var(--c-line); padding: 6px 10px; text-align: left; }
  .doc th { background: var(--c-bg-2); font-weight: 600; }

  .welcome { max-width: var(--reading-max); margin: 0 auto; padding: 48px 32px; }
  .welcome-card { background: var(--c-paper); border: 1px solid var(--c-line); border-radius: var(--radius); padding: 44px; box-shadow: var(--shadow); }
  .welcome h1 { font-size: 40px; font-weight: 600; color: var(--c-accent); margin: 0 0 8px; }
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 18px; }
  .cat-card { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--c-bg-2); border: 1px solid var(--c-line); border-radius: var(--radius); color: var(--c-ink); text-decoration: none; }
  .cat-card:hover { background: var(--c-paper); transform: translateY(-1px); border-color: var(--c-accent); }
  .cat-card .nm { font-weight: 600; color: var(--c-accent); flex: 1; }

  .hl { background: #3a2d12; color: #f2cc60; padding: 0 2px; border-radius: 2px; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; max-height: 60vh; }
    .reader, .welcome { padding: 20px 14px; }
    .cat-grid { grid-template-columns: 1fr; }
  }
  @media print {
    .sidebar, .topbar { display: none; }
    .app { grid-template-columns: 1fr; }
    .reader-inner { border: 0; box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1 class="brand">🛡️ Bernat CyberLab AI</h1>
    <p class="brand-sub">Laboratori de ciberseguretat · llibre viu</p>
    <input id="search" class="search" type="search" placeholder="Cerca…" autocomplete="off">
    <ul class="nav" id="nav"></ul>
    <div style="margin-top:22px;padding-top:16px;border-top:1px dashed var(--c-line);font-size:11.5px;color:var(--c-ink-2)">
      Generat __DATE__<br>__TOTAL__ documents · __NCAT__ categories
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs"><a href="#" data-home>🛡️ Inici</a></div>
    </div>
    <div id="view" class="welcome"></div>
  </main>
</div>
<script>
(() => {
  const DOCS = __DOCS__;
  const SIDEBAR = __SIDEBAR__;
  const TOTAL = __TOTAL__;

  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const debounce = (fn, ms=120) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  function readHash() {
    const m = location.hash.match(/[#&]doc=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function writeHash(id) {
    const h = '#doc=' + encodeURIComponent(id);
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  const INDEX = DOCS.map(d => ({...d, hay: (d.title + ' ' + d.summary + ' ' + d.path).toLowerCase()}));

  function searchDocs(q) {
    q = q.trim().toLowerCase();
    if (!q) return null;
    const tokens = q.split(/\s+/).filter(Boolean);
    return INDEX
      .map(d => tokens.every(t => d.hay.includes(t)) ? d : null)
      .filter(Boolean);
  }
  function highlightText(text, tokens) {
    if (!tokens.length) return escapeHtml(text);
    const re = new RegExp('(' + tokens.map(escapeRe).join('|') + ')', 'gi');
    return escapeHtml(text).replace(re, '<mark class="hl">$1</mark>');
  }

  function renderDoc(id) {
    const doc = DOCS.find(d => d.id === id);
    if (!doc) { renderWelcome(); return; }
    writeHash(id);
    document.title = doc.title + ' · Bernat CyberLab';
    $('#crumbs').innerHTML =
      '<a href="#" data-home>🛡️ Inici</a>' +
      '<span class="sep">›</span>' +
      '<span>' + escapeHtml(doc.category) + '</span>' +
      '<span class="sep">›</span>' +
      '<span>' + escapeHtml(doc.title) + '</span>';
    const view = $('#view');
    view.className = 'reader';
    view.innerHTML =
      '<div class="reader-inner">' +
        '<article class="doc">' + doc.html + '</article>' +
      '</div>';
    $$('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.id === id));
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function renderWelcome() {
    document.title = 'Bernat CyberLab AI';
    $('#crumbs').innerHTML = '<a href="#" data-home>🛡️ Inici</a>';
    const view = $('#view');
    view.className = 'welcome';
    let html =
      '<div class="welcome-card">' +
        '<h1>🛡️ Bernat CyberLab AI</h1>' +
        '<p style="color:var(--c-ink-2);font-size:17px">Llibre viu del laboratori de ciberseguretat · ' + TOTAL + ' documents en ' + SIDEBAR.length + ' categories.</p>' +
        '<div class="cat-grid" id="cat-grid"></div>' +
      '</div>';
    view.innerHTML = html;
    const grid = $('#cat-grid');
    SIDEBAR.forEach(s => {
      const a = document.createElement('a');
      a.className = 'cat-card';
      a.href = '#cat=' + encodeURIComponent(s.name);
      a.dataset.cat = s.name;
      a.innerHTML =
        '<span>' + s.emoji + '</span>' +
        '<span class="nm">' + escapeHtml(s.name) + '</span>' +
        '<span class="ct">' + s.count + '</span>';
      a.addEventListener('click', e => {
        e.preventDefault();
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
        $('#search').value = '';
        $$('.nav-cat-btn').forEach(b => b.parentElement.classList.add('collapsed'));
        const btn = $('.nav-cat-btn[data-cat="' + CSS.escape(s.name) + '"]');
        if (btn) btn.parentElement.classList.remove('collapsed');
        btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      grid.appendChild(a);
    });
  }

  function renderSearchResults(q, tokens) {
    const results = searchDocs(q);
    document.title = (results ? results.length : 0) + ' resultats';
    $('#crumbs').innerHTML = '<a href="#" data-home>🛡️ Inici</a><span class="sep">›</span><span>Cerca: "' + escapeHtml(q) + '"</span>';
    const view = $('#view');
    view.className = 'welcome';
    if (!results || !results.length) {
      view.innerHTML = '<div class="welcome-card" style="text-align:center"><p style="color:var(--c-ink-2)">Cap resultat per a "' + escapeHtml(q) + '"</p></div>';
      return;
    }
    let html = '<div class="welcome-card"><h1 style="font-size:24px;margin:0 0 12px">Resultats</h1><ul class="nav-items" style="padding-left:0;display:grid;grid-template-columns:1fr 1fr;gap:8px">';
    for (const r of results) {
      html += '<li><a class="nav-item" href="#doc=' + encodeURIComponent(r.id) + '"><strong>' + highlightText(r.title, tokens) + '</strong><br><span style="font-size:12px">' + highlightText(r.summary || r.path, tokens) + '</span></a></li>';
    }
    html += '</ul></div>';
    view.innerHTML = html;
  }

  function renderSidebar() {
    const nav = $('#nav');
    nav.innerHTML = '';
    SIDEBAR.forEach(s => {
      const docsInCat = DOCS.filter(d => d.category === s.name);
      const li = document.createElement('li');
      li.className = 'nav-cat';
      const btn = document.createElement('button');
      btn.className = 'nav-cat-btn';
      btn.dataset.cat = s.name;
      btn.innerHTML = '<span>' + s.emoji + '</span><span>' + escapeHtml(s.name) + '</span><span class="ct">' + s.count + '</span>';
      btn.addEventListener('click', () => li.classList.toggle('collapsed'));
      li.appendChild(btn);
      const ul = document.createElement('ul');
      ul.className = 'nav-items';
      docsInCat.forEach(d => {
        const a = document.createElement('a');
        a.className = 'nav-item';
        a.href = '#doc=' + encodeURIComponent(d.id);
        a.dataset.id = d.id;
        a.textContent = d.title;
        ul.appendChild(a);
      });
      li.appendChild(ul);
      nav.appendChild(li);
    });
  }

  function route() {
    const q = $('#search').value;
    if (q.trim()) { renderSearchResults(q, q.trim().toLowerCase().split(/\s+/)); return; }
    const id = readHash();
    if (id) renderDoc(id);
    else renderWelcome();
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderSidebar();
    route();
    $('#search').addEventListener('input', debounce(route, 100));
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-home]');
      if (t) { e.preventDefault(); location.hash = ''; $('#search').value = ''; renderWelcome(); }
    });
    window.addEventListener('hashchange', route);
  });
})();
</script>
</body>
</html>
