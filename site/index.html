lt;ISO_NAME&gt;.iso&quot; -Algorithm SHA256\n</code></pre>\n<h3>Veure particions i tipus (GPT/MBR)</h3>\n<pre><code class=\"language-powershell\">Get-Disk | Format-Table Number, FriendlyName, PartitionStyle, OperationalStatus -AutoSize\n(Get-Disk -Number 0).PartitionStyle\n</code></pre>\n<h3>Veure volums i unitats del sistema</h3>\n<pre><code class=\"language-powershell\">Get-Volume | Format-Table DriveLetter, FileSystemLabel, Size, Path -AutoSize\n</code></pre>\n<h3>Llistar ISOs descarregades a Downloads</h3>\n<pre><code class=\"language-powershell\">Get-ChildItem &quot;C:\\Users\\&lt;USER&gt;\\Downloads\\*.iso&quot;\n</code></pre>\n<h3>Copiar una ISO a l'USB (Ventoy o similar)</h3>\n<pre><code class=\"language-powershell\">Copy-Item &quot;C:\\Users\\&lt;USER&gt;\\Downloads\\&lt;ISO_NAME&gt;.iso&quot; -Destination &quot;&lt;USB_LETTER&gt;:\\&quot;\n</code></pre>\n<h2>🔧 Rufus (eina gràfica)</h2>\n<h3>Per gravar una Live ISO amb persistència</h3>\n<ol>\n<li>Descarregar Rufus portable des de https://www.rufus.ie</li>\n<li>Connectar USB.</li>\n<li><strong>Device</strong>: triar el USB correcte (comprovar mida!).</li>\n<li><strong>Boot selection</strong>: clicar SELECCIONAR → triar la ISO.</li>\n<li><strong>Partition scheme</strong>: <strong>GPT</strong> (UEFI modern) o <strong>MBR</strong> (BIOS antic).</li>\n<li><strong>Persistent partition size</strong>: moure el slider (32-64 GB).</li>\n<li><strong>START</strong>.</li>\n<li>Si surt el diàleg \"ISO mode DD\", vol dir que la ISO és ISOHybrid —<br>\n   cal ISO Live per persistència real.</li>\n</ol>\n<h2>🚀 Ventoy (eina gràfica)</h2>\n<h3>Instal·lació a l'USB</h3>\n<ol>\n<li>Descarregar des de https://www.ventoy.net/en/download.html</li>\n<li>Connectar USB.</li>\n<li>Obrir Ventoy → seleccionar USB → <strong>Install</strong>.</li>\n<li>Crea dues particions: una petita (Ventoy) + una gran buida.</li>\n</ol>\n<h3>Ús diari</h3>\n<ul>\n<li>Copiar ISOs a la partició gran.</li>\n<li>En arrencar, Ventoy mostra menú per triar quina ISO carregar.</li>\n</ul>\n<h2>🛠️ Instal·lar Kali al PC de l'hort</h2>\n<h3>Requisits</h3>\n<ul>\n<li>USB amb Kali Live o Installer.</li>\n<li>PC de l'hort connectat per cable al router 4G (preferible Wi-Fi).</li>\n<li>Disposar del PC de l'hort físicament per prémer tecles.</li>\n</ul>\n<h3>Pas a pas</h3>\n<ol>\n<li>Connectar l'USB al PC.</li>\n<li>Apagar i encendre.</li>\n<li>Prémer F12 (o tecla del fabricant) per entrar al menú d'arrencada.</li>\n<li>Triar el USB.</li>\n<li>Al menú de Ventoy, triar la ISO de Kali.</li>\n<li>Triar Install o Graphical Install.</li>\n<li>Configurar:<br>\n   - Idioma: Català o Anglès.<br>\n   - Xarxa: per cable, automàtica.<br>\n   - Nom d'amfitrió: <code>cyber-host</code>.<br>\n   - Usuari: el teu nom d'usuari.<br>\n   - Contrasenya: una forta (a KeePassXC!).<br>\n   - Disc: usar tot el disc (esborrarà tot!).<br>\n   - GRUB: instal·lar a <code>/dev/sda</code>.</li>\n<li>Esperar 15-30 min.</li>\n<li>Reiniciar, treure l'USB.</li>\n</ol>\n<h3>Verificar</h3>\n<pre><code class=\"language-bash\">whoami\nuname -a\nip a      # buscar la interfície amb IP 192.168.x.x\n</code></pre>\n<h2>🔗 Tailscale — instal·lació i ús</h2>\n<p>Tailscale crea una xarxa privada virtual (VPN mesh) entre tots els<br>\ndispositius. Permet accedir al lab de l'hort des de qualsevol lloc,<br>\nignorant CGNAT i IPs dinàmiques.</p>\n<h3>Per què serveix</h3>\n<ul>\n<li>SSH al lab des del Mac de casa, del mòbil, etc.</li>\n<li>Resol CGNAT (NAT traversal automàtic).</li>\n<li>Compatible amb IP dinàmica.</li>\n<li>Xifrat punta a punta (WireGuard).</li>\n</ul>\n<h3>Instal·lació al PC de l'hort</h3>\n<pre><code class=\"language-bash\">curl -fsSL https://tailscale.com/install.sh | sh\nsudo tailscale up\n</code></pre>\n<p>Si dóna error de DNS:</p>\n<pre><code class=\"language-bash\">sudo systemctl enable --now tailscaled\nsudo tailscale up\n</code></pre>\n<h3>Instal·lació al Mac (casa o hort)</h3>\n<pre><code class=\"language-bash\"># Opció 1: brew\nbrew install --cask tailscale\n\n# Opció 2: descarregar de https://tailscale.com/download\n</code></pre>\n<h3>Obtenir la IP dins del tailnet</h3>\n<pre><code class=\"language-bash\">sudo tailscale ip -4\n</code></pre>\n<p>Retorna <code>100.x.y.z</code>. Anota-la.</p>\n<h3>Accedir des d'un altre dispositiu</h3>\n<ol>\n<li>Instal·lar Tailscale al client.</li>\n<li>Login amb el mateix compte.</li>\n<li>SSH:</li>\n</ol>\n<pre><code class=\"language-bash\">ssh &lt;USER&gt;@cyber-host      # o per IP: ssh &lt;USER&gt;@100-x-y-z\n</code></pre>\n<h3>Estat del tailnet</h3>\n<pre><code class=\"language-bash\">tailscale status\n</code></pre>\n<p>Apareixen tots els dispositius connectats i les seves IPs.</p>\n<h3>Apagar / encendre Tailscale</h3>\n<pre><code class=\"language-bash\">sudo tailscale down\nsudo tailscale up\n</code></pre>\n<h2>💻 Ordres Kali bàsiques (al PC de l'hort)</h2>\n<h3>Identitat i xarxa</h3>\n<pre><code class=\"language-bash\">whoami                      # usuari actual\nuname -a                    # versió del kernel\nhostname                    # nom del sistema\nip a                        # totes les interfícies\nip route                    # ruta per defecte\nping -c 4 8.8.8.8           # provar sortida a Internet\nping -c 4 google.com        # igual amb nom\n</code></pre>\n<h3>Sistema de fitxers</h3>\n<pre><code class=\"language-bash\">ls                          # llistar\nls -la                      # amb ocults\npwd                         # on sóc\ncd /tmp                     # canviar\ncat fitxer.txt              # veure contingut\nless /var/log/syslog        # veure logs\ndf -h                       # espai en disc\nfree -h                     # memòria\n</code></pre>\n<h3>Usuaris i permisos</h3>\n<pre><code class=\"language-bash\">who                         # usuaris connectats\nsudo ordre                  # executar com a root\nsu - usuari                 # canviar d'usuari\nchmod 755 fitxer            # canviar permisos\nchown user:group fitxer     # canviar propietari\n</code></pre>\n<h3>Processos i serveis</h3>\n<pre><code class=\"language-bash\">ps aux                      # processos actius\ntop                         # monitor en temps real\nhtop                        # versió millorada (instal·lar-la)\nsystemctl status servei     # estat d'un servei\nsudo systemctl start servei\nsudo systemctl stop servei\nsudo systemctl restart servei\nsudo systemctl enable servei\n</code></pre>\n<h3>Xarxa avançada</h3>\n<pre><code class=\"language-bash\">ss -tulnp                   # ports oberts\nip neigh                    # taula ARP\narp -a                      # clients connectats al router\n</code></pre>\n<h3>Actualitzar el sistema</h3>\n<pre><code class=\"language-bash\">sudo apt update\nsudo apt upgrade -y\nsudo apt dist-upgrade -y\nsudo apt autoremove -y\n</code></pre>\n<h2>🛡️ Eines de seguretat essencials (a Kali)</h2>\n<h3>nmap — escàner de xarxa</h3>\n<pre><code class=\"language-bash\">nmap 192.168.1.1            # un host\nnmap 192.168.1.0/24         # tota la xarxa\nnmap -sV 192.168.1.1        # versions de serveis\nnmap -A 192.168.1.1         # detecció agressiva\nnmap -p- 192.168.1.1        # tots els ports\nnmap -sS 192.168.1.1        # SYN stealth\nnmap -sn 192.168.1.0/24     # només hosts (ping sweep)\n</code></pre>\n<h3>wireshark — captura de tràfic (gràfica)</h3>\n<pre><code class=\"language-bash\">sudo wireshark\n# triar interfície (eth0 per cable, wlan0 per WiFi)\n# filtres: http, tcp.port == 80, ip.addr == 192.168.1.1\n</code></pre>\n<p>Alternativa terminal (tcpdump):</p>\n<pre><code class=\"language-bash\">sudo tcpdump -i eth0\nsudo tcpdump -i wlan0 -w captura.pcap\nsudo tcpdump -r captura.pcap\n</code></pre>\n<h3>aircrack-ng — auditoria WiFi</h3>\n<p>Cal una clau WiFi USB amb mode monitor (RT3070 o RTL8812AU).</p>\n<pre><code class=\"language-bash\">sudo airmon-ng start wlan0\nsudo airodump-ng wlan0mon\nsudo airodump-ng -c 1 --bssid XX:XX:XX:XX:XX:XX -w captura wlan0mon\nsudo aircrack-ng captura-01.cap\n</code></pre>\n<h3>hydra — força bruta de login</h3>\n<pre><code class=\"language-bash\">hydra -l admin -P /usr/share/wordlists/rockyou.txt 192.168.1.1 ssh\nhydra -l admin -P /usr/share/wordlists/rockyou.txt 192.168.1.1 http-get\n</code></pre>\n<h3>john — cracker de contrasenyes</h3>\n<pre><code class=\"language-bash\">john --wordlist=/usr/share/wordlists/rockyou.txt hash.txt\njohn --show hash.txt\n</code></pre>\n<h3>netcat (ncat) — eines de xarxa</h3>\n<pre><code class=\"language-bash\">nc -lvp 4444                # port d'escolta\nnc 192.168.1.1 80           # connectar\nsudo ncat -lvnp 4444        # variant moderna\n</code></pre>\n<h3>gobuster / dirb — descoberta web</h3>\n<pre><code class=\"language-bash\">gobuster dir -u http://192.168.1.1 -w /usr/share/wordlists/dirb/common.txt\ndirb http://192.168.1.1\n</code></pre>\n<h2>📋 Procediment: primera sessió de pràctiques</h2>\n<ol>\n<li>Connectar al router 4G de Parlem.</li>\n<li>Obrir terminal.</li>\n<li>Veure la IP:</li>\n</ol>\n<pre><code class=\"language-bash\">ip a | grep 192\n</code></pre>\n<ol start=\"4\">\n<li>Calcular el rang. Si la IP és <code>192.168.1.42</code>, la xarxa és <code>192.168.1.0/24</code>.</li>\n<li>Escanejar tota la xarxa:</li>\n</ol>\n<pre><code class=\"language-bash\">nmap -sn 192.168.1.0/24\n</code></pre>\n<ol start=\"6\">\n<li>Identificar tots els dispositius.</li>\n<li>Triar-ne un (mai el router!) i fer un escaneig més profund:</li>\n</ol>\n<pre><code class=\"language-bash\">nmap -sV 192.168.1.42\n</code></pre>\n<ol start=\"8\">\n<li>Anotar ports i serveis.</li>\n</ol>\n<h2>🧪 Exercicis guiats (sense risc)</h2>\n<h3>Metasploitable 2</h3>\n<ol>\n<li>Descarregar de https://sourceforge.net/projects/metasploitable/</li>\n<li>Importar a VirtualBox (dins del PC de l'hort).</li>\n<li>Iniciar la VM.</li>\n<li>Des de Kali:</li>\n</ol>\n<pre><code class=\"language-bash\">nmap 192.168.x.0/24     # descobrir la IP de Metasploitable\nnmap -sV -p- 192.168.x.x\n</code></pre>\n<ol start=\"5\">\n<li>Usar Metasploit:</li>\n</ol>\n<pre><code class=\"language-bash\">msfconsole\nsearch vsftpd\nuse exploit/unix/ftp/vsftpd_234_backdoor\nset RHOSTS 192.168.x.x\nexploit\n</code></pre>\n<h3>DVWA (Damn Vulnerable Web App)</h3>\n<ol>\n<li>Dins de Kali:</li>\n</ol>\n<pre><code class=\"language-bash\">sudo apt install dvwa\n# o descarregar de https://github.com/digininja/DVWA\n</code></pre>\n<ol start=\"2\">\n<li>Accedir a <code>http://127.0.0.1/dvwa</code> des del navegador.</li>\n<li>Setup → crear / reset database.</li>\n<li>Login amb <code>admin/password</code>.</li>\n<li>Security level: Low.</li>\n<li>SQL Injection, XSS, Command Injection, File Inclusion...</li>\n</ol>\n<h2>🌐 Plataformes d'aprenentatge en línia</h2>\n<ul>\n<li><strong>TryHackMe</strong>: https://tryhackme.com — guiat, ideal per començar.</li>\n<li><strong>HackTheBox Academy</strong>: https://academy.hackthebox.com — més avançat.</li>\n<li><strong>OverTheWire</strong>: https://overthewire.org/wargames/ — wargames.</li>\n<li><strong>PortSwigger Web Security Academy</strong>: https://portswigger.net/web-security — web security gratuït.</li>\n<li><strong>VulnHub</strong>: https://www.vulnhub.com — màquines virtuals vulnerables.</li>\n</ul>\n<h2>📖 Glossari ràpid</h2>\n<table>\n<thead>\n<tr>\n<th>Terme</th>\n<th>Definició</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Live ISO</strong></td>\n<td>Imatge que arrenca sense instal·lar</td>\n</tr>\n<tr>\n<td><strong>Persistència</strong></td>\n<td>Guardar canvis entre arrencades en USB Live</td>\n</tr>\n<tr>\n<td><strong>ISOHybrid</strong></td>\n<td>ISO que es pot gravar a CD/DVD o USB</td>\n</tr>\n<tr>\n<td><strong>GPT / MBR</strong></td>\n<td>Esquemes de partició. GPT per UEFI, MBR per BIOS antics</td>\n</tr>\n<tr>\n<td><strong>CGNAT</strong></td>\n<td>Carrier-Grade NAT. Operador comparteix IP pública entre clients</td>\n</tr>\n<tr>\n<td><strong>Tailscale</strong></td>\n<td>VPN mesh basat en WireGuard</td>\n</tr>\n<tr>\n<td><strong>WireGuard</strong></td>\n<td>Protocol VPN modern, molt ràpid</td>\n</tr>\n<tr>\n<td><strong>nmap</strong></td>\n<td>Eina d'escaneig de xarxa</td>\n</tr>\n<tr>\n<td><strong>Wireshark</strong></td>\n<td>Analitzador de protocols de xarxa</td>\n</tr>\n<tr>\n<td><strong>Metasploit</strong></td>\n<td>Framework d'explotació amb milers d'exploits</td>\n</tr>\n<tr>\n<td><strong>DVWA</strong></td>\n<td>Aplicació web vulnerable per practicar</td>\n</tr>\n<tr>\n<td><strong>Kali Linux</strong></td>\n<td>Distribució Linux per a pentesting</td>\n</tr>\n<tr>\n<td><strong>Lab</strong></td>\n<td>Entorn controlat per practicar seguretat</td>\n</tr>\n<tr>\n<td><strong>Pentesting</strong></td>\n<td>Proves de penetració simulades</td>\n</tr>\n<tr>\n<td><strong>Vector d'atac</strong></td>\n<td>Mètode que un atacant usa per accedir</td>\n</tr>\n<tr>\n<td><strong>Vulnerabilitat</strong></td>\n<td>Punt feble explotable</td>\n</tr>\n<tr>\n<td><strong>Exploit</strong></td>\n<td>Codi que aprofita una vulnerabilitat</td>\n</tr>\n<tr>\n<td><strong>Payload</strong></td>\n<td>Codi que s'executa quan l'exploit té èxit</td>\n</tr>\n<tr>\n<td><strong>Mode monitor</strong></td>\n<td>Mode WiFi que captura tot el tràfic</td>\n</tr>\n<tr>\n<td><strong>NAT traversal</strong></td>\n<td>Tècnica per fer connexions peer-to-peer a través de NAT</td>\n</tr>\n<tr>\n<td><strong>DERP relay</strong></td>\n<td>Servidors de relay de Tailscale quan NAT traversal falla</td>\n</tr>\n</tbody>\n</table>\n<h2>⚠️ Avís legal i laboral</h2>\n<ul>\n<li>Tots els exercicis sobre <strong>dispositius propis</strong> o amb <strong>permís explícit</strong>.</li>\n<li>Auditar equips aliens és delicte (articles 197 i 264 del Codi Penal espanyol).</li>\n<li><strong>Mai</strong> practicar des de l'equip de la feina — risc laboral encara que<br>\n  l'objectiu sigui el teu propi PC.</li>\n<li>Veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/appendices/cap-00-50-etica-legalitat-abast.md\">CAP-00-50</a> per a la política<br>\n  ètica completa del projecte.</li>\n</ul>\n<hr>\n<p><em>Última actualització: 2026-07-28 — sincronitzada amb l'arquitectura 2-ubicacions del CyberLab.</em></p>"}, {"id": "book-appendices-ann-07-historia-del-projecte.md", "path": "book/appendices/ann-07-historia-del-projecte.md", "title": "ANN-07 — Història del projecte", "summary": "Esbossos inicials. Definició del PC potent de l'hort + Mac potent de casa", "category": "Apèndixs", "html": "<h1>ANN-07 — Història del projecte</h1>\n<blockquote>\n<p>L'evolució del CyberLab des dels seus orígens. Per què s'ha fet cada cosa<br>\nen cada moment. Un diari de decisions.</p>\n</blockquote>\n<h2>Cronologia</h2>\n<h3>2026-07-27 — Orígens (sessió inicial al projecte)</h3>\n<p>Esbossos inicials. Definició del PC potent de l'hort + Mac potent de casa<br>\ncom a nucli del projecte. Primeres idees sobre Kali, Metasploitable, DVWA.</p>\n<h3>2026-07-28 — Decisió de Kali</h3>\n<p>Triada la distro: <strong>Kali Linux</strong> (vs Parrot/WiFiSlax). Motius: comunitat<br>\ngran, molts tutorials, eines preinstal·lades.</p>\n<p>Decisions operatives preses:<br>\n- Distro: <strong>Kali Linux 2026.2</strong> (Live amd64 amb persistència o Installer).<br>\n- USB: <strong>Kingston 256 GB</strong> amb Ventoy.<br>\n- Eines: <strong>nmap, hydra, john, aircrack-ng, wireshark</strong>.<br>\n- Accés remot: <strong>Tailscale</strong> (per CGNAT + IP dinàmica).</p>\n<h3>2026-07-28 — Decàrrega i validació de la ISO</h3>\n<p>Descarregada i validada <code>kali-linux-2026.2-installer-amd64.iso</code> (SHA256<br>\nverificat).</p>\n<h3>2026-07-28 — Rufus vs Ventoy</h3>\n<p>Inicialment triat <strong>Rufus</strong>, però descobert que:<br>\n- ISO <strong>installer</strong> no porta persistència.<br>\n- Les Live ISO només via torrent.<br>\n- Rufus forçava mode DD amb ISOs ISOHybrid (perdia persistència).</p>\n<p>Decisió canviada a <strong>Ventoy al USB Kingston 256 GB</strong> (instal·lat Ventoy).</p>\n<h3>2026-07-30 — Xuleta de comandes</h3>\n<p>Creat <code>xuleta-comandes.md</code> i <code>xuleta-comandes.pdf</code> (5 pàgines) amb totes<br>\nles ordres apreses fins al moment.</p>\n<h3>2026-07-30 — Decisió final sobre maquinari</h3>\n<p>Triat definitivament:<br>\n- <strong>PC de l'hort</strong> (HP Z1 G9, 32 GB RAM) com a <code>cyber-host</code> potent.<br>\n- <strong>Mac vell de l'hort</strong> com a màquina complementària.<br>\n- <strong>RPi hort-osona</strong> queda <strong>fora</strong> (pertany al projecte hort-osona).<br>\n- <strong>Mac potent de casa</strong> com a centre de control.</p>\n<h3>2026-07-30 — Política legal consolidada</h3>\n<ul>\n<li>❌ Mai des de l'equip de la feina (risc laboral).</li>\n<li>✅ Tot des dels Macs personals.</li>\n<li>✅ Sobre dispositius propis o amb autorització.</li>\n<li>✅ Plataformes legals: TryHackMe, HackTheBox, OverTheWire, PortSwigger.</li>\n</ul>\n<h3>2026-07-30 — Decisió Parlem 5G</h3>\n<p>Operador mòbil de l'hort: <strong>Parlem 5G</strong>, 150 GB/mes. CGNAT actiu → Tailscale<br>\nés l'única via còmoda.</p>\n<h3>2026-07-31 — Primer PROJECT_STATE</h3>\n<p>Creat <code>PROJECT_STATE.md</code> a <code>C:\\Users\\iadmin\\Documents\\lab-seguretat\\</code> per<br>\ngarantir continuïtat entre sessions.</p>\n<h3>2026-07-31 — Idees descartades</h3>\n<ul>\n<li>Integrar CyberLab al projecte <strong>BernatLab</strong> del curs (idea abortada).<br>\n  Motiu: barrejar conceptes diferents. Es reprendrà més endavant quan hi<br>\n  hagi URL pròpia.</li>\n<li>Usar la <strong>RPi del hort-osona</strong> com a <code>cyber-pi</code>. Motiu: pertany a un altre<br>\n  projecte actiu.</li>\n</ul>\n<h3>2026-07-28 (reprise) — Creació del projecte <code>cyberlab-ai</code> al GitHub</h3>\n<ul>\n<li>Repo <code>BernatMora/cyberlab-ai</code> creat.</li>\n<li>Estructura completa + llicència doble (MIT + CC BY-SA 4.0).</li>\n<li>Llibre Viu iniciat amb Bloc 0 publicat.</li>\n<li>38 capítols d'esquelet preparats.</li>\n</ul>\n<h3>2026-07-28 — Integració del material antic</h3>\n<p>Aquest annex s'ha creat per integrar i actualitzar la informació del<br>\nPROJECT_STATE antic al context actual del projecte al GitHub.</p>\n<h2>Lliçons apreses (per no repetir-les)</h2>\n<h3>Tècniques</h3>\n<ul>\n<li><strong>ISO installer ≠ ISO live</strong>: la ISO installer no porta persistència.<br>\n  Per a persistència de veritat cal ISO <strong>live</strong>.</li>\n<li><strong>Live ISO només via torrent</strong> (o kali-weekly HTTP).</li>\n<li><strong>Rufus + ISOHybrid = mode DD forçat</strong>: perd opció de persistència. Per<br>\n  a Kali, millor <strong>Ventoy</strong>.</li>\n<li><strong>Ventoy crea dues particions</strong>: una petita (boot) + una gran (ISOs).<br>\n  L'Explorador de Windows pot amagar la partició gran → usar <code>Get-Volume</code><br>\n  per veure-les totes.</li>\n<li><strong>CGNAT</strong> impossibilita port forwarding directe. Tailscale és l'única<br>\n  solució còmoda amb Parlem 5G.</li>\n<li><strong>Tailscale + WireGuard</strong> = NAT traversal automàtic + xifrat punta a<br>\n  punta.</li>\n<li><strong>Wake-on-LAN</strong> cal activar-lo a la BIOS/UEFI; sense això, no podem<br>\n  despertar el PC de l'hort des de casa.</li>\n</ul>\n<h3>De gestió</h3>\n<ul>\n<li><strong>Mai practicar des de l'equip de la feina</strong> — risc laboral encara que<br>\n  l'objectiu sigui casa teva.</li>\n<li><strong>Documentar cada decisió</strong> en una ADR per no repetir-la d'aquí 2 anys.</li>\n<li><strong>Xuleta de comandes</strong> = millor que dependre d'una IA per a les ordres<br>\n  bàsiques.</li>\n<li><strong>PROJECT_STATE.md</strong> és or: permet reprendre una sessió amb context.</li>\n<li><strong>Separar projectes</strong>: el CyberLab NO és el mateix que el projecte<br>\n  hort-osona ni que el curs BernatLab.</li>\n</ul>\n<h3>De metodologia</h3>\n<ul>\n<li><strong>Decidir abans de comprar</strong>: abans de comprar cap peça nova, validar<br>\n  que l'arquitectura actual pot assumir les noves necessitats.</li>\n<li><strong>Confirmar l'arquitectura amb proves reals</strong>, no amb suposicions.</li>\n<li><strong>Una sessió = una decisió important</strong>: no voler fer tot en una sola<br>\n  sessió porta a errors.</li>\n<li><strong>Backup primer</strong>: abans de qualsevol canvi important, còpia de seguretat.</li>\n</ul>\n<h2>Estadístiques de les sessions anteriors</h2>\n<ul>\n<li>Durada: ~4 dies (sessions esparses entre 27-30 juliol).</li>\n<li>ISO validada: <code>kali-linux-2026.2-installer-amd64.iso</code> (SHA256 valid).</li>\n<li>USB preparat: Kingston 256 GB amb Ventoy.</li>\n<li>Eines apreses: Get-FileHash, Get-Disk, Get-Volume, Copy-Item,<br>\n  qBittorrent, Rufus, Ventoy.</li>\n<li>Documents creats: xuleta-comandes.md, xuleta-comandes.pdf,<br>\n  PROJECT_STATE.md.</li>\n<li>Coneixements consolidats: CGNAT, Tailscale, Rufus vs Ventoy, ISO<br>\n  live vs installer.</li>\n</ul>\n<h2>Fonts</h2>\n<ul>\n<li><a href=\"#doc=docs-00-pla-director.md\"><code>docs/00-pla-director.md</code></a> — Pla Director actual</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0001-arquitectura-general.md\"><code>ADR/0001-arquitectura-general.md</code></a> — Arquitectura revisada</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0002-rolls-per-equip.md\"><code>ADR/0002-rolls-per-equip.md</code></a> — Rols revisats</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/appendices/cap-01-60-ubicacions-i-desplegaments.md\">CAP-01-60</a> — Ubicacions i desplegaments</li>\n<li><a href=\"#doc=book-appendices-ann-05-xuleta-comandes.md\">ANN-05</a> — Xuleta de comandes</li>\n<li>Material antic a <code>C:\\Users\\iadmin\\Documents\\lab-seguretat\\</code> (no versionat;<br>\n  conservat localment).</li>\n</ul>\n<hr>\n<p><em>Última actualització: 2026-07-28 — sincronitzada amb l'estat actual del projecte.</em></p>"}];

  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const debounce = (fn, ms=120) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  function readHash() {
    const m = location.hash.match(/[#&]doc=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function writeHash(id) {
    const h = '#doc=' + encodeURIComponent(id);
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  const INDEX = DOCS.map(d => ({...d, hay: (d.title + ' ' + d.summary + ' ' + d.path).toLowerCase()}));

  function searchDocs(q) {
    q = q.trim().toLowerCase();
    if (!q) return null;
    const tokens = q.split(/\s+/).filter(Boolean);
    return INDEX
      .map(d => tokens.every(t => d.hay.includes(t)) ? d : null)
      .filter(Boolean);
  }
  function highlightText(text, tokens) {
    if (!tokens.length) return escapeHtml(text);
    const re = new RegExp('(' + tokens.map(escapeRe).join('|') + ')', 'gi');
    return escapeHtml(text).replace(re, '<mark class="hl">$1</mark>');
  }

  function renderDoc(id) {
    const doc = DOCS.find(d => d.id === id);
    if (!doc) { renderWelcome(); return; }
    writeHash(id);
    document.title = doc.title + ' · Bernat CyberLab';
    $('#crumbs').innerHTML =
      '<a href="#" data-home>🛡️ Inici</a>' +
      '<span class="sep">›</span>' +
      '<span>' + escapeHtml(doc.category) + '</span>' +
      '<span class="sep">›</span>' +
      '<span>' + escapeHtml(doc.title) + '</span>';
    const view = $('#view');
    view.className = 'reader';
    view.innerHTML =
      '<div class="reader-inner">' +
        '<article class="doc">' + doc.html + '</article>' +
      '</div>';
    $$('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.id === id));
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function renderWelcome() {
    document.title = 'Bernat CyberLab AI';
    $('#crumbs').innerHTML = '<a href="#" data-home>🛡️ Inici</a>';
    const view = $('#view');
    view.className = 'welcome';
    let html =
      '<div class="welcome-card">' +
        '<h1>🛡️ Bernat CyberLab AI</h1>' +
        '<p style="color:var(--c-ink-2);font-size:17px">Llibre viu del laboratori de ciberseguretat · ' + TOTAL + ' documents en ' + SIDEBAR.length + ' categories.</p>' +
        '<div class="cat-grid" id="cat-grid"></div>' +
      '</div>';
    view.innerHTML = html;
    const grid = $('#cat-grid');
    SIDEBAR.forEach(s => {
      const a = document.createElement('a');
      a.className = 'cat-card';
      a.href = '#cat=' + encodeURIComponent(s.name);
      a.dataset.cat = s.name;
      a.innerHTML =
        '<span>' + s.emoji + '</span>' +
        '<span class="nm">' + escapeHtml(s.name) + '</span>' +
        '<span class="ct">' + s.count + '</span>';
      a.addEventListener('click', e => {
        e.preventDefault();
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
        $('#search').value = '';
        $$('.nav-cat-btn').forEach(b => b.parentElement.classList.add('collapsed'));
        const btn = $('.nav-cat-btn[data-cat="' + CSS.escape(s.name) + '"]');
        if (btn) btn.parentElement.classList.remove('collapsed');
        btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      grid.appendChild(a);
    });
  }

  function renderSearchResults(q, tokens) {
    const results = searchDocs(q);
    document.title = (results ? results.length : 0) + ' resultats';
    $('#crumbs').innerHTML = '<a href="#" data-home>🛡️ Inici</a><span class="sep">›</span><span>Cerca: "' + escapeHtml(q) + '"</span>';
    const view = $('#view');
    view.className = 'welcome';
    if (!results || !results.length) {
      view.innerHTML = '<div class="welcome-card" style="text-align:center"><p style="color:var(--c-ink-2)">Cap resultat per a "' + escapeHtml(q) + '"</p></div>';
      return;
    }
    let html = '<div class="welcome-card"><h1 style="font-size:24px;margin:0 0 12px">Resultats</h1><ul class="nav-items" style="padding-left:0;display:grid;grid-template-columns:1fr 1fr;gap:8px">';
    for (const r of results) {
      html += '<li><a class="nav-item" href="#doc=' + encodeURIComponent(r.id) + '"><strong>' + highlightText(r.title, tokens) + '</strong><br><span style="font-size:12px">' + highlightText(r.summary || r.path, tokens) + '</span></a></li>';
    }
    html += '</ul></div>';
    view.innerHTML = html;
  }

  function renderSidebar() {
    const nav = $('#nav');
    nav.innerHTML = '';
    SIDEBAR.forEach(s => {
      const docsInCat = DOCS.filter(d => d.category === s.name);
      const li = document.createElement('li');
      li.className = 'nav-cat';
      const btn = document.createElement('button');
      btn.className = 'nav-cat-btn';
      btn.dataset.cat = s.name;
      btn.innerHTML = '<span>' + s.emoji + '</span><span>' + escapeHtml(s.name) + '</span><span class="ct">' + s.count + '</span>';
      btn.addEventListener('click', () => li.classList.toggle('collapsed'));
      li.appendChild(btn);
      const ul = document.createElement('ul');
      ul.className = 'nav-items';
      docsInCat.forEach(d => {
        const a = document.createElement('a');
        a.className = 'nav-item';
        a.href = '#doc=' + encodeURIComponent(d.id);
        a.dataset.id = d.id;
        a.textContent = d.title;
        ul.appendChild(a);
      });
      li.appendChild(ul);
      nav.appendChild(li);
    });
  }

  function route() {
    const q = $('#search').value;
    if (q.trim()) { renderSearchResults(q, q.trim().toLowerCase().split(/\s+/)); return; }
    const id = readHash();
    if (id) renderDoc(id);
    else renderWelcome();
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderSidebar();
    route();
    $('#search').addEventListener('input', debounce(route, 100));
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-home]');
      if (t) { e.preventDefault(); location.hash = ''; $('#search').value = ''; renderWelcome(); }
    });
    window.addEventListener('hashchange', route);
  });
})();
</script>
</body>
</html>
