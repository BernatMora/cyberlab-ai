(() => {
  const DOCS = [{"id": "book-readme.md", "path": "book/README.md", "title": "El Llibre Viu del Bernat CyberLab", "summary": "Aquest llibre no és una documentació tècnica convencional. És el registre", "category": "El llibre", "html": "<h1>El Llibre Viu del Bernat CyberLab</h1>\n<blockquote>\n<p>Manual tècnic, memòria viva i llibre d'estudi del laboratori personal de<br>\nciberseguretat de Bernat Mora.</p>\n</blockquote>\n<p>Aquest llibre no és una documentació tècnica convencional. És el registre<br>\ncomplet, viu i en evolució del projecte Bernat CyberLab AI: explica què és,<br>\nper què existeix, com es construeix i què s'ha après durant el procés.</p>\n<p>Està pensat perquè <strong>d'aquí a uns anys</strong> qualsevol persona amb coneixements<br>\ntècnics pugui reconstruir completament el laboratori només llegint-lo.</p>\n<h2>Llicència</h2>\n<p>Aquest llibre està publicat sota la llicència <strong>CC BY-SA 4.0</strong>. Es permet<br>\ncopiar-lo, compartir-lo i adaptar-lo, fins i tot comercialment, sempre que<br>\nes reconegui l'autoria i les obres derivades es publiquin sota la mateixa<br>\nllicència.</p>\n<p>El <strong>codi i els scripts</strong> del repositori continuen sota llicència MIT<br>\n(véure <code>LICENSE-CODE</code> a l'arrel del repo).</p>\n<h2>Filosofia editorial</h2>\n<p>Cada capítol segueix una estructura comuna de 15 seccions (introdueix,<br>\njustifica, instal·la, configura, verifica, resol, etc.) i <strong>referencia els<br>\naltres capítols</strong> per formar una xarxa de coneixement. Veure<br>\n<a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/templates/cap-XX-YY.md\"><code>templates/cap-XX-YY.md</code></a>.</p>\n<p>Mai no assumim coneixements previs: expliquem primer el <strong>què</strong> i el <strong>per<br>\nquè</strong> d'una tecnologia, i només després el <strong>com</strong> l'apliquem al CyberLab.</p>\n<h2>Sistema de codis permanents</h2>\n<p>Tot el contingut del llibre té un <strong>codi únic i permanent</strong> que no es<br>\nreutilitza ni es modifica encara que el títol canviï. Format:</p>\n<table>\n<thead>\n<tr>\n<th>Tipus</th>\n<th>Format</th>\n<th>Exemple</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Capítol</td>\n<td><code>CAP-XX-YY</code></td>\n<td><code>CAP-03-20</code> (Subxarxes i segmentació)</td>\n</tr>\n<tr>\n<td>Exercici</td>\n<td><code>EX-XX-YY</code></td>\n<td><code>EX-08-10</code> (Primera inspecció de DVWA)</td>\n</tr>\n<tr>\n<td>Laboratori pràctic</td>\n<td><code>LAB-XX-YY</code></td>\n<td><code>LAB-15-10</code> (Laboratori web bàsic)</td>\n</tr>\n<tr>\n<td>Decisió d'arquitectura</td>\n<td><code>ADR-XXX</code></td>\n<td><code>ADR-007</code> (Adoptem Hyper-V)</td>\n</tr>\n<tr>\n<td>Resolució de problemes</td>\n<td><code>TRB-XX-YY</code></td>\n<td><code>TRB-18-10</code> (Docker no arrenca a Windows)</td>\n</tr>\n<tr>\n<td>Checklist</td>\n<td><code>CHK-XX-YY</code></td>\n<td><code>CHK-02-10</code> (Auditoria de maquinari)</td>\n</tr>\n<tr>\n<td>Annex</td>\n<td><code>ANN-XX</code></td>\n<td><code>ANN-01</code> (Glossari)</td>\n</tr>\n</tbody>\n</table>\n<p>S'utilitzen <strong>salts de 10</strong> entre capítols per poder intercalar-ne de nous<br>\nsense renumerar tot el llibre.</p>\n<p>Cada fitxer comença amb <strong>metadades YAML</strong> (id, title, status, version,<br>\ncreated, updated, authors, tags, prerequisites, related). El codi (<code>id</code>)<br>\nés la identitat permanent; el títol pot canviar.</p>\n<h3>Estats possibles</h3>\n<ul>\n<li><code>idea</code> — només una idea, sense estructura.</li>\n<li><code>outline</code> — esquema bàsic, falten seccions.</li>\n<li><code>draft</code> — esborrany en curs.</li>\n<li><code>review</code> — pendent de revisió final.</li>\n<li><code>published</code> — publicat i validat.</li>\n<li><code>deprecated</code> — substituït per un altre capítol (mantenir amb redirect).</li>\n</ul>\n<h2>Estructura</h2>\n<pre><code>book/\n├── README.md                   ← guia editorial (aquest fitxer)\n├── SUMMARY.md                  ← índex mestre del llibre\n├── LICENSE                     ← CC BY-SA 4.0\n│\n├── chapters/                   ← capítols principals\n│   ├── cap-00-10-proleg.md\n│   ├── cap-00-20-filosofia.md\n│   └── ...\n│\n├── exercises/                  ← exercicis curts associats als capítols\n├── labs/                       ← laboratoris pràctics complets\n├── assets/                     ← imatges, diagrames, taules\n│   ├── diagrams/\n│   ├── screenshots/\n│   └── tables/\n│\n├── appendices/                 ← glossari, comandes, checklists, referències\n│\n└── templates/                  ← plantilles per a nous capítols\n    ├── cap-XX-YY.md\n    ├── ex-XX-YY.md\n    ├── lab-XX-YY.md\n    ├── adr-XXX.md\n    ├── trb-XX-YY.md\n    ├── chk-XX-YY.md\n    └── ann-XX.md\n</code></pre>\n<h2>Com contribuir</h2>\n<p>Per afegir un capítol nou:</p>\n<ol>\n<li>Tria un <code>id</code> lliure respectant els salts de 10.</li>\n<li>Copia la plantilla corresponent (<code>templates/cap-XX-YY.md</code>).</li>\n<li>Omple les <strong>metadades YAML</strong> (sobretot <code>id</code>, <code>title</code>, <code>status: draft</code>).</li>\n<li>Escriu el contingut seguint les 15 seccions.</li>\n<li>Afegeix el capítol al <code>SUMMARY.md</code>.</li>\n<li>Referència els capítols relacionats a <code>related:</code> (i vice-versa).</li>\n<li>Obre un PR amb el patró <code>book/cap-XX-YY: descripció curta</code>.</li>\n</ol>\n<h2>Política de secrets</h2>\n<p>Igual que la resta del repo:</p>\n<ul>\n<li>❌ Mai cap IP real, MAC, contrasenya, token ni clau al llibre.</li>\n<li>✅ Sempre placeholders (<code>&lt;CYBER_HOST_IP&gt;</code>, <code>&lt;TAILSCALE_AUTHKEY&gt;</code>).</li>\n<li>✅ Exemples amb valors ficticis (10.10.x.x, <code>cyber-host.tailnet</code>).</li>\n<li>✅ Configuracions reals a <code>BernatCyberLab/_local/</code> (no versionat).</li>\n</ul>\n<p>Veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/CONTRIBUTING.md\"><code>../CONTRIBUTING.md</code></a> per a la política completa.</p>\n<h2>Evolució</h2>\n<p>Aquest llibre <strong>mai es considerarà acabat</strong>. Quan canviem una configuració,<br>\nafegim una màquina, instal·lem una eina o millorem una automatització,<br>\ntambé cal actualitzar el capítol corresponent.</p>\n<p>La documentació i el laboratori han d'estar <strong>sempre sincronitzats</strong>.</p>\n<hr>\n<p><a href=\"#doc=book-chapters-cap-00-10-proleg.md\">Comença pel Pròleg →</a></p>"}, {"id": "book-chapters-cap-00-10-proleg.md", "path": "book/chapters/cap-00-10-proleg.md", "title": "CAP-00-10 — Pròleg", "summary": "Aquest llibre no és un manual d'instal·lació. Tampoc és una col·lecció de", "category": "El llibre", "html": "<h1>CAP-00-10 — Pròleg</h1>\n<blockquote>\n<p>Benvingut al Llibre Viu del Bernat CyberLab.</p>\n</blockquote>\n<h2>Per què aquest llibre existeix</h2>\n<p>Aquest llibre no és un manual d'instal·lació. Tampoc és una col·lecció de<br>\nconfiguracions copiades d'Internet. És la <strong>memòria viva d'un projecte</strong> que<br>\nvol construir un laboratori personal de ciberseguretat, modular, segur,<br>\ndocumentat i evolucionable.</p>\n<p>La idea és senzilla: cada vegada que afegim una eina, canviem una<br>\nconfiguració, aprenem un error o prenem una decisió, ho deixem per escrit.<br>\nNo només el \"què\" i el \"com\", sinó també el <strong>\"per què\"</strong>. Perquè d'aquí a<br>\ndos, cinc o deu anys, puguem rellegir-lo i entendre exactament què vam fer,<br>\nper què ho vam fer, què hauria de continuar igual i què hauria de canviar.</p>\n<h2>A qui va dirigit</h2>\n<ul>\n<li>A <strong>mi mateix</strong>, quan hagi oblidat detalls.</li>\n<li>A qualsevol persona amb coneixements tècnics que vulgui <strong>reconstruir el<br>\n  laboratori</strong> des de zero.</li>\n<li>A estudiants o professionals que vulguin veure un exemple real de<br>\n  projecte de ciberseguretat amb totes les seves virtuts i imperfeccions.</li>\n</ul>\n<h2>Què trobaràs</h2>\n<ul>\n<li><strong>22 capítols</strong> organitzats en 9 blocs temàtics.</li>\n<li><strong>Exercicis i laboratoris pràctics</strong> associats a cada tema.</li>\n<li><strong>Decisions documentades</strong> (ADR) que expliquen per què hem triat cada<br>\n  tecnologia.</li>\n<li><strong>Resolucions de problemes</strong> reals (TRB).</li>\n<li><strong>Plantilles</strong> per crear nous capítols, exercicis i laboratoris amb el<br>\n  mateix format.</li>\n</ul>\n<h2>Què NO trobaràs</h2>\n<ul>\n<li>Informació sensible real: cap IP privada, MAC, contrasenya, token ni clau.</li>\n<li>Promeses de cobertura completa: aquest llibre serà eternament incomplet.</li>\n<li>Perfecció: cometrem errors i els documentarem tal com són.</li>\n</ul>\n<h2>Com navegar-lo</h2>\n<p>Si ets la primera vegada, comença pel <a href=\"#doc=book-chapters-cap-00-20-filosofia.md\">CAP-00-20</a>,<br>\ndesprés el <a href=\"#doc=book-chapters-cap-00-30-objectius.md\">CAP-00-30</a>, el<br>\n<a href=\"#doc=book-chapters-cap-00-40-com-llegir.md\">CAP-00-40</a> i el<br>\n<a href=\"#doc=book-chapters-cap-00-50-etica-legalitat-abast.md\">CAP-00-50</a>. A partir del CAP-01 tens<br>\nel llibre tècnic pròpiament dit.</p>\n<p>Si ja tens experiència, salta a la <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/SUMMARY.md\"><code>SUMMARY.md</code></a> i tria el<br>\nbloc que t'interessi.</p>\n<h2>Una nota sobre Hermes</h2>\n<p>Hermes és el meu assistent tècnic i coautor d'aquest llibre. La seva<br>\nparticipació es nota sobretot en:</p>\n<ul>\n<li>L'estructura i la claredat del llenguatge.</li>\n<li>La identificació de patrons i bones pràctiques.</li>\n<li>L'automatització d'algunes tasques repetitives.</li>\n</ul>\n<p>Les <strong>decisions finals, l'ètica i la responsabilitat</strong> són meves.</p>\n<hr>\n<p><em>Comencem.</em></p>"}, {"id": "book-chapters-cap-00-20-filosofia.md", "path": "book/chapters/cap-00-20-filosofia.md", "title": "CAP-00-20 — Filosofia del CyberLab", "summary": "Aquest capítol estableix els **7 principis rectors** del CyberLab. Totes", "category": "El llibre", "html": "<h1>CAP-00-20 — Filosofia del CyberLab</h1>\n<blockquote>\n<p>Els principis que guien totes les decisions tècniques del projecte.</p>\n</blockquote>\n<p>Aquest capítol estableix els <strong>7 principis rectors</strong> del CyberLab. Totes<br>\nles decisions posteriors — quina eina instal·lar, quina arquitectura triar,<br>\nquins recursos dedicar — es contrasten amb aquesta llista.</p>\n<h2>1. Modular</h2>\n<blockquote>\n<p>Cada component té una responsabilitat clara i pot substituir-se.</p>\n</blockquote>\n<ul>\n<li>Un sol servei per fitxer de configuració.</li>\n<li>Les dependències entre mòduls són explícites i documentades.</li>\n<li>Afegir o treure una peça no ha de trencar la resta.</li>\n</ul>\n<p>Per què? Perquè els projectes de laboratori tendeixen a créixer orgànicament<br>\ni acabar com un bolet de configuracions interdependents on tocar una cosa<br>\npot trencar tres més.</p>\n<h2>2. Escalable</h2>\n<blockquote>\n<p>Afegir una nova VM, contenidor o eina ha de ser trivial i documentat.</p>\n</blockquote>\n<ul>\n<li>Cada nova peça té la seva pròpia secció al llibre i la seva ADR.</li>\n<li>Els esquemes d'adreces IP tenen espai per créixer.</li>\n<li>Les capacitats del maquinari es mesuren, no es suposen.</li>\n</ul>\n<p>Per què? Perquè d'aquí un any voldré afegir un Active Directory, una eina<br>\nde forense o un model d'IA local més gran, i hauria de poder fer-ho sense<br>\nreplantejar tota l'arquitectura.</p>\n<h2>3. Documentat</h2>\n<blockquote>\n<p>Cada decisió tècnica té una justificació escrita i un procediment pas a pas.</p>\n</blockquote>\n<ul>\n<li>Cap decisió important sense una ADR (Architecture Decision Record).</li>\n<li>Cada instal·lació té el seu capítol amb les 15 seccions estàndard.</li>\n<li>Cap configuració sense un README que l'expliqui.</li>\n</ul>\n<p>Per què? Perquè la memòria humana és fràgil i el coneixement no documentat<br>\nés coneixement perdut.</p>\n<h2>4. Automatitzat</h2>\n<blockquote>\n<p>Les tasques repetibles són scripts, no clics manuals.</p>\n</blockquote>\n<ul>\n<li>Scripts al repo per a tot allò que s'hagi de fer més d'una vegada.</li>\n<li>Plantilles per a coses comunes (crear VM, crear contenidor, crear ADR).</li>\n<li>Hooks de pre/post a Git quan calgui.</li>\n</ul>\n<p>Per què? Perquè automatitzar allò que es repeteix allibera temps per a<br>\nl'aprenentatge, que és l'objectiu últim.</p>\n<h2>5. Segur</h2>\n<blockquote>\n<p>El laboratori no és un joc; s'aplica el principi de mínim privilegi.</p>\n</blockquote>\n<ul>\n<li>Xifratge de discs al PC i a la Raspberry.</li>\n<li>Autenticació multifactor a tots els serveis externs.</li>\n<li>Xarxes segmentades i aïllament de màquines vulnerables.</li>\n<li>Cap secret en text pla al Git.</li>\n<li>Cap port obert al router domèstic que no sigui estrictament necessari.</li>\n</ul>\n<p>Per què? Perquè el fet que sigui un laboratori no vol dir que pugui estar<br>\ndesprotegit. Aprendre seguretat implica <strong>fer seguretat</strong>.</p>\n<h2>6. Fàcil de mantenir</h2>\n<blockquote>\n<p>Un altre tu (o un col·laborador) ha de poder reprendre el projecte en 6<br>\nmesos només llegint la documentació.</p>\n</blockquote>\n<ul>\n<li>Convencions clares (noms, estructura, formats).</li>\n<li>Scripts d'auditoria que recullen l'estat actual del sistema.</li>\n<li>Cap dependència de decisions no documentades.</li>\n</ul>\n<p>Per què? Perquè el context es perd. Si la documentació no és prou bona per<br>\nrellegir-la sense context, no és prou bona.</p>\n<h2>7. Ètic i legal</h2>\n<blockquote>\n<p>Totes les pràctiques es limiten a dispositius, màquines virtuals,<br>\ncontenidors i serveis propis. No es dissenyen ni s'automatitzen activitats<br>\ndirigides contra sistemes de tercers.</p>\n</blockquote>\n<ul>\n<li>Aïllament de xarxa per a totes les màquines vulnerables.</li>\n<li>Monitorització per detectar qualsevol tràfic de sortida no desitjat.</li>\n<li>Cap càrrega d'eines ofensives a màquines amb accés a la xarxa domèstica.</li>\n<li>Una reflexió explícita sobre l'abast a <a href=\"#doc=book-chapters-cap-00-50-etica-legalitat-abast.md\">CAP-00-50</a>.</li>\n</ul>\n<p>Per què? Perquè la ciberseguretat ètica comença amb la pròpia conducta.</p>\n<h2>Com s'apliquen aquests principis</h2>\n<p>Cada decisió tecnològica del projecte es contrasta amb aquesta llista. Si<br>\nuna elecció trenca més d'un principi, requereix una justificació<br>\nextraordinària i una ADR explícita.</p>\n<p>Per exemple:</p>\n<ul>\n<li>\n<p>\"Per què Ollama al MacBook Pro i no al PC Windows?\"<br>\n  → Modularitat (responsabilitat clara), escala (no competeix amb les VMs),<br>\n    seguretat (aïlla la càrrega d'IA del cor del laboratori).</p>\n</li>\n<li>\n<p>\"Per què Tailscale i no una VPN tradicional?\"<br>\n  → Modularitat (un sol agent), facilitat (no exposar ports), manteniment<br>\n    (configuració mínima), escala (afegir un node és un clic).</p>\n</li>\n<li>\n<p>\"Per què Hyper-V i no Proxmox?\"<br>\n  → Modularitat (no esborrar Windows), escala (coexisteix amb WSL2),<br>\n    facilitat (natiu). Compromís: rendiment lleugerament inferior a Proxmox.</p>\n</li>\n</ul>\n<h2>Resum</h2>\n<p>7 principis: <strong>modular, escalable, documentat, automatitzat, segur, fàcil<br>\nde mantenir, ètic i legal</strong>. Tots ells al servei d'un únic objectiu:<br>\naprendre.</p>\n<h2>Referències</h2>\n<ul>\n<li><a href=\"#doc=book-chapters-cap-00-10-proleg.md\">CAP-00-10</a> — Pròleg</li>\n<li><a href=\"#doc=book-chapters-cap-00-30-objectius.md\">CAP-00-30</a> — Objectius del projecte</li>\n<li><a href=\"#doc=book-chapters-cap-00-50-etica-legalitat-abast.md\">CAP-00-50</a> — Ètica, legalitat i abast</li>\n<li><a href=\"#doc=docs-00-pla-director.md\"><code>docs/00-pla-director.md</code></a> — Pla Director del laboratori</li>\n</ul>"}, {"id": "book-chapters-cap-00-30-objectius.md", "path": "book/chapters/cap-00-30-objectius.md", "title": "CAP-00-30 — Objectius del projecte", "summary": "Construir un **laboratori personal de ciberseguretat, completament legal,", "category": "El llibre", "html": "<h1>CAP-00-30 — Objectius del projecte</h1>\n<blockquote>\n<p>Què volem aconseguir amb el Bernat CyberLab AI.</p>\n</blockquote>\n<h2>Objectiu principal</h2>\n<p>Construir un <strong>laboratori personal de ciberseguretat, completament legal,<br>\nprivat i orientat exclusivament a l'aprenentatge</strong>, que funcioni dins la<br>\nnostra pròpia infraestructura, modular, escalable, segur i documentat,<br>\ncap d'evolucionar durant anys.</p>\n<h2>Objectius específics</h2>\n<h3>1. Aprenentatge pràctic</h3>\n<p>Vull practicar, no només llegir:</p>\n<ul>\n<li>Linux (Ubuntu Server, Kali, gestió de serveis, scripting bash).</li>\n<li>Windows (administració, Active Directory, PowerShell).</li>\n<li>Xarxes (segmentació, VLAN, DNS, anàlisi de tràfic amb Wireshark).</li>\n<li>Docker i contenidors.</li>\n<li>Wireshark i anàlisi de paquets.</li>\n<li>Forense digital.</li>\n<li>Programació (Python, bash, scripts d'automatització).</li>\n<li>IA aplicada a la ciberseguretat (anàlisi de logs, generació de regles,<br>\n  assistent de laboratori).</li>\n<li>Anàlisi defensiva (SIEM, IDS, monitorització).</li>\n<li>Seguretat web en entorns de laboratori (DVWA, Juice Shop, OWASP).</li>\n<li>Active Directory en laboratoris propis.</li>\n<li>Gestió de vulnerabilitats en entorns de prova (OpenVAS/GVM).</li>\n</ul>\n<p>Tot <strong>sobre màquines i serveis propis del laboratori</strong>. Mai contra sistemes<br>\nexterns.</p>\n<h3>2. Plataforma estable</h3>\n<p>No vull una col·lecció de scripts que funcioni \"de vegades\". Vull una<br>\nplataforma:</p>\n<ul>\n<li>Que pugui estar engegada 24/7 sense intervenció manual.</li>\n<li>Que es recuperi sola d'un tall elèctric.</li>\n<li>Que documenti ella mateixa el seu estat.</li>\n<li>Que es pugui refer ràpidament des d'una còpia de seguretat.</li>\n</ul>\n<h3>3. Arquitectura escalable</h3>\n<p>Afegir una nova eina o VM ha de ser:</p>\n<ul>\n<li><strong>Documentat</strong>: una ADR que justifiqui la decisió.</li>\n<li><strong>Reproduïble</strong>: un script o un conjunt de comandes que ho faci sempre igual.</li>\n<li><strong>Aïllat</strong>: la nova peça no afecta les existents.</li>\n<li><strong>Reversible</strong>: es pot treure sense deixar rastre.</li>\n</ul>\n<h3>4. Documentació viva</h3>\n<p>No una documentació que s'escriu al final i queda obsoleta. Vull:</p>\n<ul>\n<li>Un llibre (aquest) que creix amb el projecte.</li>\n<li>ADR per a cada decisió important.</li>\n<li>TRB (resolucions de problemes) per a cada bug no trivial.</li>\n<li>Exercicis i laboratoris documentats pas a pas.</li>\n</ul>\n<h3>5. Automatització progressiva</h3>\n<p>No automatitzar-ho tot des del primer dia. Anar afegint automatització<br>\nquan una tasca es repeteix prou vegades per justificar l'script.</p>\n<p>Hermes participarà progressivament:<br>\n- Inicialment: <strong>consultar i recomanar</strong>.<br>\n- Més endavant: <strong>executar tasques reversibles</strong> (arrancar contenidors,<br>\n  generar esquemes).<br>\n- Més endavant: <strong>executar tasques amb confirmació humana</strong> (modificar<br>\n  configuracions, crear VMs).<br>\n- MAI: <strong>accés administratiu il·limitat</strong>.</p>\n<p>Veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-06-20-hermes.md\">CAP-06-20</a>.</p>\n<h3>6. Aplicació de la IA</h3>\n<p>La IA no és el centre del projecte, és una eina més. Vull usar-la per:</p>\n<ul>\n<li>Accelerar l'anàlisi de logs.</li>\n<li>Generar esquemes de xarxa i documentació.</li>\n<li>Suggerir exercicis personalitzats segons el meu progrés.</li>\n<li>Ajudar a entendre alertes de seguretat.</li>\n</ul>\n<p>Però <strong>mai</strong> per substituir el coneixement fonamental. Si no entenc per què<br>\nuna cosa funciona, no la poso en producció.</p>\n<h3>7. Compartició selectiva</h3>\n<p>Aquest projecte és personal però <strong>el llibre és públic</strong>. La raó és doble:</p>\n<ul>\n<li>Documentar en públic em força a escriure millor.</li>\n<li>Pot ajudar algú en una situació semblant.</li>\n</ul>\n<p>Compromís: cap dada sensible real al repo. Tots els exemples amb<br>\nplaceholders.</p>\n<h2>Anti-objectius</h2>\n<p>Tan important com saber què volem és saber <strong>què NO volem</strong>:</p>\n<ul>\n<li>❌ No és un CTF competitiu.</li>\n<li>❌ No és un entorn per practicar contra tercers.</li>\n<li>❌ No és un servei comercial ni multi-usuari.</li>\n<li>❌ No és una rèplica exacta d'una empresa; és un laboratori d'aprenentatge.</li>\n<li>❌ No és una cursa per tenir més eines; tenir-ne menys i ben enteses és millor.</li>\n</ul>\n<h2>Com es mesura l'èxit</h2>\n<p>El projecte serà un èxit si, d'aquí a 5 anys:</p>\n<ol>\n<li>Puc tornar a aquest llibre i entendre tot el que hi ha explicat.</li>\n<li>Puc reconstruir el laboratori en 1-2 dies des de zero seguint les<br>\n   instruccions.</li>\n<li>He après els fonaments que volia aprendre.</li>\n<li>Tinc una base sòlida per continuar creixent.</li>\n</ol>\n<p>Si només una d'aquestes quatre coses es compleix, encara serà un èxit.</p>\n<h2>Resum</h2>\n<ul>\n<li>Aprenentatge pràctic sobre infraestructura pròpia.</li>\n<li>Plataforma estable, escalable, documentada.</li>\n<li>Automatització progressiva amb Hermes com a assistent.</li>\n<li>IA com a eina, no com a substitut del coneixement.</li>\n<li>Compartició selectiva (repo públic, dades privades).</li>\n</ul>\n<h2>Referències</h2>\n<ul>\n<li><a href=\"#doc=book-chapters-cap-00-20-filosofia.md\">CAP-00-20</a> — Filosofia del CyberLab</li>\n<li><a href=\"#doc=book-chapters-cap-00-40-com-llegir.md\">CAP-00-40</a> — Com llegir aquest llibre</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-01-10-arquitectura-general.md\">CAP-01-10</a> — Arquitectura general</li>\n</ul>"}, {"id": "book-chapters-cap-00-40-com-llegir.md", "path": "book/chapters/cap-00-40-com-llegir.md", "title": "CAP-00-40 — Com llegir aquest llibre", "summary": "Aquest llibre assumeix **coneixements tècnics generals** (saber què és una", "category": "El llibre", "html": "<h1>CAP-00-40 — Com llegir aquest llibre</h1>\n<blockquote>\n<p>Una guia per treure el màxim profit d'aquest material.</p>\n</blockquote>\n<h2>A qui va dirigit cada nivell</h2>\n<p>Aquest llibre assumeix <strong>coneixements tècnics generals</strong> (saber què és una<br>\nIP, un sistema operatiu, una xarxa) però <strong>no assumeix coneixements previs<br>\nde cap eina concreta</strong>. Cada capítol comença pel \"què és\" i acaba al \"com<br>\nl'ho apliquem al CyberLab\".</p>\n<p>Si ets:</p>\n<h3>Principiant amb ganes</h3>\n<ol>\n<li>Llegeix els capítols del <strong>Bloc 0</strong> (introdueix el projecte).</li>\n<li>Llegeix el <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-01-10-arquitectura-general.md\">CAP-01-10</a> i el<br>\n<a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-01-30-xarxes-fonaments.md\">CAP-01-30</a>.</li>\n<li>Fes els exercicis guiats (Bloc 9).</li>\n<li>Salta als capítols concrets quan et calguin.</li>\n</ol>\n<h3>Professional amb experiència</h3>\n<ol>\n<li>Llegeix els <strong>Bloc 0</strong> ràpidament (5 minuts).</li>\n<li>Mira el <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/SUMMARY.md\"><code>SUMMARY.md</code></a> per veure l'abast.</li>\n<li>Salta als capítols que t'interessen.</li>\n<li>Compara les nostres eleccions amb les teves (les ADR estan ben<br>\n   justificades i pots dirimir ràpidament).</li>\n</ol>\n<h3>Estudiant de ciberseguretat</h3>\n<ol>\n<li>Llegeix tot seguint l'ordre del SUMMARY.</li>\n<li>Fes tots els exercicis del Bloc 9.</li>\n<li>Reescriu les ADR amb les teves decisions; compara-les amb les nostres.</li>\n</ol>\n<h2>Convencions del llibre</h2>\n<h3>Codis permanents</h3>\n<p>Cada fitxer té un <strong>codi únic</strong> al frontmatter YAML:</p>\n<table>\n<thead>\n<tr>\n<th>Prefix</th>\n<th>Tipus</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>CAP-XX-YY</code></td>\n<td>Capítol</td>\n</tr>\n<tr>\n<td><code>EX-XX-YY</code></td>\n<td>Exercici</td>\n</tr>\n<tr>\n<td><code>LAB-XX-YY</code></td>\n<td>Laboratori pràctic</td>\n</tr>\n<tr>\n<td><code>ADR-XXX</code></td>\n<td>Decisió d'arquitectura</td>\n</tr>\n<tr>\n<td><code>TRB-XX-YY</code></td>\n<td>Resolució de problema</td>\n</tr>\n<tr>\n<td><code>CHK-XX-YY</code></td>\n<td>Checklist</td>\n</tr>\n<tr>\n<td><code>ANN-XX</code></td>\n<td>Annex</td>\n</tr>\n</tbody>\n</table>\n<p>El codi és <strong>permanent</strong>: si un capítol canvia de títol, el codi no canvia.<br>\nSi un capítol queda obsolet, es marca com a <code>deprecated</code> però el codi es<br>\nconserva.</p>\n<h3>Estructura comuna dels capítols</h3>\n<p>Tots els capítols segueixen <strong>15 seccions estàndard</strong> (veure la<br>\n<a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/templates/cap-XX-YY.md\">plantilla</a>):</p>\n<ol>\n<li>Què és?</li>\n<li>Per què existeix?</li>\n<li>Quan s'utilitza?</li>\n<li>Alternatives</li>\n<li>Avantatges</li>\n<li>Inconvenients</li>\n<li>Arquitectura al CyberLab</li>\n<li>Instal·lació</li>\n<li>Configuració</li>\n<li>Verificació</li>\n<li>Problemes habituals</li>\n<li>Bones pràctiques</li>\n<li>Aspectes de seguretat</li>\n<li>Automatització amb Hermes</li>\n<li>Resum</li>\n</ol>\n<h3>Estats dels capítols</h3>\n<ul>\n<li><code>idea</code> — encara no hi ha estructura.</li>\n<li><code>outline</code> — esquema bàsic amb les 15 seccions.</li>\n<li><code>draft</code> — esborrany en curs.</li>\n<li><code>review</code> — pendent de revisió.</li>\n<li><code>published</code> — publicat i validat.</li>\n<li><code>deprecated</code> — substituït.</li>\n</ul>\n<p>Pots veure l'estat global al <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/SUMMARY.md\"><code>SUMMARY.md</code></a>.</p>\n<h3>Notació</h3>\n<ul>\n<li><code>codi</code> — text exacte a teclejar (comandes, fitxers).</li>\n<li><code>[CAP-XX-YY](cap-XX-YY.md)</code> — enllaç a un altre capítol.</li>\n<li><strong><a href=\"../chapters/...\">ADR-XXX</a></strong> — decisió documentada.</li>\n<li>⚠️ — avís important (risc, error comú).</li>\n<li>💡 — consell pràctic.</li>\n<li>🔒 — aspecte de seguretat.</li>\n</ul>\n<h3>Exemples i placeholders</h3>\n<p>Tots els exemples del llibre usen:</p>\n<ul>\n<li><strong>IPs fictícies</strong>: <code>10.10.20.0/24</code>, <code>192.168.x.x</code>.</li>\n<li><strong>Noms genèrics</strong>: <code>cyber-host</code>, <code>kali-01</code>.</li>\n<li><strong>Placeholders</strong>: <code>&lt;CYBER_HOST_IP&gt;</code>, <code>&lt;TAILSCALE_AUTHKEY&gt;</code>.</li>\n</ul>\n<p>Cap valor real. Si necessites els teus valors reals, mira<br>\n<code>BernatCyberLab/_local/</code> al PC (no versionat).</p>\n<h2>Com navegar entre capítols</h2>\n<p>Cada capítol enllaça amb:</p>\n<ul>\n<li>Els seus <strong>prerequisites</strong>: capítols que cal llegir abans.</li>\n<li>Els seus <strong>related</strong>: capítols que hi estan connectats.</li>\n<li>Les <strong>ADR</strong> que el justifiquen.</li>\n<li>Els <strong>exercicis i laboratoris</strong> associats.</li>\n</ul>\n<p>Si comences pel <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-01-10-arquitectura-general.md\">CAP-01-10</a> i segueixes<br>\nl'ordre, tens una lectura lineal completa. Si vols saltar, mira els<br>\nprerequisites de cada capítol.</p>\n<h2>Ritme de lectura recomanat</h2>\n<table>\n<thead>\n<tr>\n<th>Tipus de capítol</th>\n<th>Temps estimat</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bloc 0 (introdueix)</td>\n<td>15-20 min</td>\n</tr>\n<tr>\n<td>Capítol tècnic publicat</td>\n<td>20-40 min</td>\n</tr>\n<tr>\n<td>Exercici</td>\n<td>15-60 min</td>\n</tr>\n<tr>\n<td>Laboratori pràctic</td>\n<td>1-4 h</td>\n</tr>\n</tbody>\n</table>\n<p>Per al <strong>Bloc 0</strong> sencer, calcula ~1 hora.</p>\n<h2>Com contribuir</h2>\n<p>Si vols afegir un capítol, un exercici o una ADR:</p>\n<ol>\n<li>Tria un <code>id</code> lliure respectant els salts de 10.</li>\n<li>Copia la plantilla corresponent.</li>\n<li>Omple el frontmatter YAML.</li>\n<li>Segueix l'estructura estàndard.</li>\n<li>Afegeix-lo al <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/SUMMARY.md\"><code>SUMMARY.md</code></a>.</li>\n<li>Obre un PR.</li>\n</ol>\n<p>Veure <a href=\"#doc=book-readme.md\"><code>README.md</code></a> per detalls.</p>\n<h2>Resum</h2>\n<ul>\n<li>Tres audiències definides.</li>\n<li>Codis permanents, 15 seccions estàndard, 6 estats possibles.</li>\n<li>Notació clara i exemples sempre amb placeholders.</li>\n<li>Ritme flexible, navegació per prerequisites i related.</li>\n</ul>\n<h2>Referències</h2>\n<ul>\n<li><a href=\"#doc=book-chapters-cap-00-30-objectius.md\">CAP-00-30</a> — Objectius</li>\n<li><a href=\"#doc=book-chapters-cap-00-50-etica-legalitat-abast.md\">CAP-00-50</a> — Ètica</li>\n<li><a href=\"#doc=book-readme.md\"><code>README.md</code></a> — Guia editorial del llibre</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/SUMMARY.md\"><code>SUMMARY.md</code></a> — Índex mestre</li>\n</ul>"}, {"id": "book-chapters-cap-00-50-etica-legalitat-abast.md", "path": "book/chapters/cap-00-50-etica-legalitat-abast.md", "title": "CAP-00-50 — Ètica, legalitat i abast", "summary": "dispositius, màquines virtuals, contenidors i serveis propis.**", "category": "El llibre", "html": "<h1>CAP-00-50 — Ètica, legalitat i abast</h1>\n<blockquote>\n<p>Aquest capítol existeix per una raó concreta: la ciberseguretat comença<br>\nper la pròpia conducta. Sense reflexió ètica, un laboratori és perillós.</p>\n</blockquote>\n<h2>Principi fonamental</h2>\n<p><strong>Totes les pràctiques d'aquest laboratori es limiten exclusivament a<br>\ndispositius, màquines virtuals, contenidors i serveis propis.</strong></p>\n<p>No es dissenyen ni s'automatitzen activitats dirigides contra sistemes de<br>\ntercers. No es fan probes en xarxes alienes. No s'exploren vulnerabilitats<br>\nen serveis que no siguin nostres.</p>\n<h2>Per què importa</h2>\n<h3>1. És il·legal</h3>\n<p>Accedir, interrompre o simplement explorar sistemes informàtics aliens<br>\nsense autorització és delicte a la majoria de jurisdiccions, inclosa<br>\nl'espanyola (Llei Orgànica 10/1995 del Codi Penal, articles 197 bis i<br>\ntercers; i normativa europea equivalent).</p>\n<h3>2. És immoral</h3>\n<p>Independentment de la legalitat, fer proves contra tercers sense el seu<br>\nconsentiment viola el seu dret a la privacitat i a la integritat dels<br>\nseus sistemes.</p>\n<h3>3. És contraproduent</h3>\n<p>Una persona que practica ofensivament fora del seu laboratori no està<br>\naprendre ciberseguretat: està posant en risc la seva carrera, la seva<br>\nllibertat i la reputació de la comunitat.</p>\n<h2>L'abast del CyberLab</h2>\n<h3>Dins de l'abast</h3>\n<p>Tot el que sigui <strong>nostre</strong> i estigui <strong>aïllat</strong>:</p>\n<ul>\n<li>Les màquines virtuals del nostre PC.</li>\n<li>Els contenidors Docker al nostre entorn.</li>\n<li>Les màquines vulnerables descarregades oficialment (Metasploitable,<br>\n  DVWA, Juice Shop, etc.).</li>\n<li>Les xarxes internes del laboratori (10.10.x.x).</li>\n<li>Els serveis que aixequem nosaltres mateixos.</li>\n</ul>\n<h3>Fora de l'abast</h3>\n<ul>\n<li>Qualsevol dispositiu de la xarxa domèstica <strong>fora</strong> del laboratori.</li>\n<li>Qualsevol servei a Internet sense autorització explícita i per escrit.</li>\n<li>Qualsevol dispositiu d'un veí, d'un amic o d'un desconegut.</li>\n<li>Qualsevol sistema d'una empresa per la qual treballem (encara que hi<br>\n  tinguem accés, hi ha polítiques).</li>\n<li>Qualsevol xarxa Wi-Fi pública oberta.</li>\n</ul>\n<h3>Àrea grisa (cal extremada precaució)</h3>\n<ul>\n<li><strong>CTFs (Capture The Flag)</strong>: sí, però sempre en entorns controlats.</li>\n<li><strong>Bug bounties</strong>: sí, però amb compte registrat i respectant l'abast<br>\n  definit per l'empresa.</li>\n<li><strong>HackTheBox / TryHackMe / VulnHub</strong>: sí, són plataformes legals.</li>\n<li><strong>Pràctiques en empreses amb autorització</strong>: sí, sempre amb carta<br>\n  signada i clàusules clares.</li>\n</ul>\n<h2>Com es garanteix l'aïllament</h2>\n<h3>Xarxa</h3>\n<ul>\n<li>Les xarxes de laboratori (<code>10.10.20/30/40.0/24</code>) <strong>no es publiquen</strong> a<br>\n  Tailscale.</li>\n<li>Les màquines vulnerables <strong>no tenen Gateway per defecte</strong> — no poden<br>\n  trucar a casa.</li>\n<li>Cap port obert al router domèstic.</li>\n<li>Les xarxes internes del laboratori estan separades de la LAN domèstica<br>\n  per Hyper-V vSwitch.</li>\n</ul>\n<p>Detalls a <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-01-40-subxarxes-segmentacio.md\">CAP-01-40</a>.</p>\n<h3>Identitat</h3>\n<ul>\n<li>Cap servei del laboratori usa les nostres credencials personals reals.</li>\n<li>Comptes separats per a administració del laboratori.</li>\n<li>Cap correu personal ni compte bancari en cap servei del laboratori.</li>\n</ul>\n<h3>Dades</h3>\n<ul>\n<li>Cap dada personal real al repo.</li>\n<li>Cap dada personal real al laboratori (només dades de prova generades<br>\n  per a aquest propòsit).</li>\n</ul>\n<h3>Eines</h3>\n<ul>\n<li>Eines ofensives només a màquines aïllades.</li>\n<li>Cap eina ofensiva a màquines amb accés a la xarxa domèstica.</li>\n<li>Tots els logs es revisen periòdicament per detectar qualsevol tràfic<br>\n  de sortida no desitjat.</li>\n</ul>\n<h2>Com actuar si trobes una vulnerabilitat \"al món real\"</h2>\n<p>Si durant una navegació, una investigació o una pràctica descobreixes una<br>\nvulnerabilitat en un sistema d'un altre:</p>\n<ol>\n<li><strong>No la provis ni la valides</strong>.</li>\n<li><strong>No la comparteixis</strong> en canals públics.</li>\n<li><strong>Contacta amb l'organització</strong> mitjançant el seu programa de<br>\n   divulgació responsable (si en té) o el seu formulari de contacte.</li>\n<li><strong>Documenta el procés</strong> al teu KeePassXC (no al repo).</li>\n</ol>\n<p>Si tens dubtes sobre si una acció és legal o ètica, <strong>no la facis</strong> fins<br>\nque ho hagis validat amb una font fiable.</p>\n<h2>Responsabilitat</h2>\n<p>La responsabilitat última de cada acció dins del laboratori és meva.<br>\nHermes pot suggerir, recomanar i executar tasques tècniques, però la<br>\ndecisió d'actuar — i la responsabilitat de les conseqüències — és sempre<br>\nhumana.</p>\n<h2>Resum</h2>\n<ul>\n<li><strong>L'abast és explícit</strong>: només sistemes propis.</li>\n<li><strong>L'aïllament és tècnic</strong>: xarxa, credencials, dades i eines separades.</li>\n<li><strong>La responsabilitat és humana</strong>: jo decideixo, jo responc.</li>\n<li><strong>La regla és simple</strong>: si no és teu o no tens autorització, no hi<br>\n  toquis.</li>\n</ul>\n<h2>Referències</h2>\n<ul>\n<li><a href=\"#doc=book-chapters-cap-00-20-filosofia.md\">CAP-00-20</a> — Filosofia (principi 7: ètic i legal)</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-01-40-subxarxes-segmentacio.md\">CAP-01-40</a> — Subxarxes i segmentació</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-04-10-tailscale.md\">CAP-04-10</a> — Tailscale (per què no exposar<br>\n  serveis directament a Internet)</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/CONTRIBUTING.md\"><code>../../CONTRIBUTING.md</code></a> — Política de secrets</li>\n</ul>"}, {"id": "book-chapters-cap-01-60-ubicacions-i-desplegaments.md", "path": "book/chapters/cap-01-60-ubicacions-i-desplegaments.md", "title": "CAP-01-60 — Ubicacions i desplegaments", "summary": "Aquest capítol documenta els **dos escenaris físics** on viu el CyberLab,", "category": "Fonaments", "html": "<h1>CAP-01-60 — Ubicacions i desplegaments</h1>\n<blockquote>\n<p>Per què el CyberLab té dues ubicacions i com s'uneixen.</p>\n</blockquote>\n<h2>1. Què és?</h2>\n<p>Aquest capítol documenta els <strong>dos escenaris físics</strong> on viu el CyberLab,<br>\nla diferència entre ells, com es comuniquen i quines implicacions té per<br>\nal dia a dia.</p>\n<h2>2. Per què existeix?</h2>\n<p>Aquest projecte neix d'una necessitat concreta: hi ha un PC potent a<br>\nl'<strong>hort</strong> que estava infrautilitzat, i un <strong>Mac potent a casa</strong> que és el<br>\ncentre de treball diari. L'objectiu és aprofitar-los tots dos per a<br>\nfinalitats diferents:</p>\n<ul>\n<li><strong>L'hort</strong> allotja les màquines virtuals, les eines ofensives i la Kali.</li>\n<li><strong>Casa</strong> allotja la consola de control, l'anàlisi, la documentació.</li>\n</ul>\n<p>Però cal resoldre el problema clàssic: com connectar dues xarxes separades<br>\ngeogràficament sense exposar serveis a Internet?</p>\n<h2>3. Quan s'utilitza?</h2>\n<p>Sempre. Aquesta és l'arquitectura per defecte del projecte. Tots els<br>\ndies laborals i caps de setmana hi ha equips engegats en ambdues ubicacions.</p>\n<h2>4. Alternatives</h2>\n<h3>Opció A — Tot a casa (un sol lloc)</h3>\n<ul>\n<li>Avantatges: simplicitat de xarxa, un sol router, una sola política.</li>\n<li>Inconvenients: el PC de l'hort queda infrautilitzat; el·lipsis del sentit<br>\n  original del projecte.</li>\n</ul>\n<h3>Opció B — Tot al núvol</h3>\n<ul>\n<li>Avantatges: cap dependència de maquinari local.</li>\n<li>Inconvenients: costos mensuals; pràctiques ofensives al núvol generen<br>\n  problemes amb els proveïdors; perd l'aprenentatge de xarxes reals.</li>\n</ul>\n<h3>Opció C — Dues ubicacions unides per Tailscale (escollida)</h3>\n<ul>\n<li>Avantatges: cada màquina al seu lloc natural; xifrat de punta a punta<br>\n  (WireGuard); resistència al CGNAT; cost zero; replicable.</li>\n<li>Inconvenients: latència hort ↔ casa (~50 ms); cal gestionar dues<br>\n  polítiques de xarxa; cal un tallafocs a cada costat.</li>\n</ul>\n<h2>5. Avantatges</h2>\n<ul>\n<li><strong>Realisme</strong>: el CyberLab reflecteix una situació real amb múltiples<br>\n  seus i equips heterogenis.</li>\n<li><strong>Resiliència</strong>: si Parlem cau, podem continuar treballant a casa.</li>\n<li><strong>Aprenentatge de xarxes reals</strong>: IPv4, NAT, CGNAT, WireGuard, DNS<br>\n  privat — tot això passa de veritat.</li>\n<li><strong>Escalabilitat</strong>: afegir una nova ubicació és trivial (un altre node<br>\n  Tailscale).</li>\n</ul>\n<h2>6. Inconvenients</h2>\n<ul>\n<li>Latència hort ↔ casa (~50 ms).</li>\n<li>Cal Wake-on-LAN al PC de l'hort per si s'apaga.</li>\n<li>El Mac vell de l'hort degradarà la bateria (sempre endollat) — cal<br>\n  controlar la càrrega amb <code>Al Dente</code> o similar.</li>\n<li>El PC de l'hort ha d'estar sempre encès → consum elèctric (~50-100 W).</li>\n</ul>\n<h2>7. Arquitectura al CyberLab</h2>\n<h3>Ubicació HORT</h3>\n<ul>\n<li><strong>Router Parlem 4G/5G</strong> (CGNAT actiu, IP pública compartida).</li>\n<li>Model pendent d'auditar a Fase 0.</li>\n<li>Connecta a Internet per 4G/5G amb 150 GB/mes.</li>\n<li><strong>Xarxa LAN de l'hort</strong>: rang habitual <code>192.168.1.0/24</code> (o el que<br>\n  tingui el router Parlem).</li>\n<li><strong>Equip 1: <code>cyber-host</code></strong> — PC HP Z1 G9 Tower, 32 GB RAM.</li>\n<li><strong>SO</strong>: Kali Linux 2026.2 instal·lat nadiu al disc.</li>\n<li>Connexió: Ethernet al router Parlem.</li>\n<li>Rol: host principal del laboratori (Kali + hipervisor per a màquines<br>\n    virtuals vulnerables).</li>\n<li><strong>Equip 2: <code>cyber-helper</code></strong> — MacBook Pro 13\" vell (macOS 12.7.6).</li>\n<li>Connexió: Ethernet o Wi-Fi al router Parlem.</li>\n<li>Rol: serveis complementaris (Tailscale, scripts, monitoratge, terminal<br>\n    alternatiu).</li>\n<li><strong><code>cyber-pi</code> (futura)</strong>: infraestructura lleugera. Decidim a Fase 1<br>\n  (veure més avall).</li>\n</ul>\n<h3>Ubicació CASA</h3>\n<ul>\n<li><strong>Router de casa</strong> (DHCP actiu, sense VLAN).</li>\n<li><strong>Xarxa LAN de casa</strong>: rang habitual <code>192.168.1.0/24</code> (pot coincidir<br>\n  amb l'hort; Tailscale ho gestiona).</li>\n<li><strong>Equip 3: <code>cyber-brain</code></strong> — Mac potent de casa.</li>\n<li>Connexió: Wi-Fi al router de casa.</li>\n<li>Rol: centre de control. Des d'aquí es fan les pràctiques, s'analitzen<br>\n    resultats, s'escriu documentació. Més endavant allotjarà Hermes<br>\n    Agent i Ollama (si el hardware ho permet).</li>\n<li><strong>Equip 4: <code>cyber-control</code></strong> — MacBook Air 13\" (macOS 26.5.2).</li>\n<li>Connexió: Wi-Fi al router de casa.</li>\n<li>Rol: consola diària. Cap servei permanent.</li>\n<li><strong>Equip 5: <code>cyber-mobile</code></strong> — iPhone 17.</li>\n<li>Connexió: Wi-Fi casa + dades mòbils.</li>\n<li>Rol: SSH mòbil, notificacions, consulta ràpida.</li>\n</ul>\n<h3>Xarxa comuna (Tailscale)</h3>\n<p>Tots els equips anteriors formen part del <strong>mateix tailnet</strong> (xarxa<br>\nprivada Tailscale):</p>\n<pre><code>Internet ──┬─── Parlem 5G (CGNAT) ─────── Hort\n           │       │\n           │       ├─── cyber-host      (Kali Linux, 32 GB)\n           │       └─── cyber-helper    (macOS 12, scripts)\n           │\n           └─── Router de casa ──────── Casa\n                       │\n                       ├─── cyber-brain       (Mac potent)\n                       ├─── cyber-control     (MacBook Air)\n                       └─── cyber-mobile      (iPhone)\n                       (i Cisco, RPi, etc.)\n\nTots units per Tailscale (WireGuard, xifrat punta a punta).\n</code></pre>\n<h2>8. Instal·lació</h2>\n<p>La instal·lació dels equips es documenta als capítols respectius:</p>\n<ul>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-08-20-kali-linux.md\">CAP-08-20</a> — Kali Linux al PC de l'hort.</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-03-30-macos-essencial.md\">CAP-03-30</a> — macOS (Mac potent, MBP vell).</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-04-10-tailscale.md\">CAP-04-10</a> — Tailscale als 5 equips.</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-04-30-firewall.md\">CAP-04-30</a> — tallafocs al PC de l'hort.</li>\n</ul>\n<h2>9. Configuració</h2>\n<h3>Configuració recomanada al PC de l'hort</h3>\n<ul>\n<li><strong>IP estàtica</strong> a la LAN de l'hort (ex. <code>192.168.1.20/24</code>).</li>\n<li><strong>Gateway</strong>: IP del router Parlem (normalment <code>192.168.1.1</code>).</li>\n<li><strong>DNS primari</strong>: <code>1.1.1.1</code> (Cloudflare) o AdGuard (si <code>cyber-pi</code> existeix).</li>\n<li><strong>Tailscale</strong> instal·lat i actiu.</li>\n<li><strong>Wake-on-LAN</strong> activat a la BIOS/UEFI (per si s'apaga).</li>\n</ul>\n<h3>Configuració recomanada al Mac potent de casa</h3>\n<ul>\n<li>Tailscale instal·lat.</li>\n<li>Sense serveis permanents addicionals (aquesta és la màquina de treball,<br>\n  no de serveis).</li>\n<li>Compte de Tailscale amb <strong>MFA activat</strong>.</li>\n</ul>\n<h3>Configuració de Tailscale</h3>\n<ul>\n<li>Tots els dispositius al tailnet amb noms <code>cyber-*</code>.</li>\n<li><strong>ACL</strong> que permeti:</li>\n<li><code>cyber-brain</code> → SSH a <code>cyber-host</code>, <code>cyber-helper</code>.</li>\n<li><code>cyber-mobile</code> → SSH a tots els cyber-* (per emergència).</li>\n<li>Cap accés directe a les xarxes <code>10.10.x</code> des del tailnet.</li>\n</ul>\n<h2>10. Verificació</h2>\n<ul>\n<li>[ ] Tots els 5 equips apareixen a <code>tailscale status</code> amb noms correctes.</li>\n<li>[ ] Ping entre equips via Tailscale: <code>ping cyber-host</code> des de<br>\n<code>cyber-brain</code> ha de respondre en &lt;100 ms.</li>\n<li>[ ] SSH des del Mac potent de casa al PC de l'hort:<br>\n<code>ssh user@cyber-host</code>.</li>\n<li>[ ] SSH des de l'iPhone al PC de l'hort: funcional.</li>\n<li>[ ] El router Parlem es pot reiniciar sense perdre l'accés (gràcies a<br>\n      Tailscale).</li>\n<li>[ ] Si apaguem el PC de l'hort, l'iPhone envia una alerta ntfy (quan<br>\n<code>cyber-pi</code> existeixi).</li>\n</ul>\n<h2>11. Problemes habituals</h2>\n<table>\n<thead>\n<tr>\n<th>Símptoma</th>\n<th>Causa probable</th>\n<th>Solució</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Latència &gt;200 ms entre casa i hort</td>\n<td>Tailscale no ha pogut fer NAT traversal directe</td>\n<td>Tailscale ho resol·lé sol; si no, verificar DERP relays</td>\n</tr>\n<tr>\n<td>SSH rebutja la contrasenya</td>\n<td>El compte Tailscale no s'ha sincronitzat correctament</td>\n<td><code>tailscale up</code> amb <code>--ssh</code> al destí</td>\n</tr>\n<tr>\n<td>CGNAT impedeix ping directe</td>\n<td>Normal — és per això que usem Tailscale</td>\n<td>No fer ping per IP pública; usar el nom del tailnet</td>\n</tr>\n<tr>\n<td>El PC de l'hort s'apaga sol</td>\n<td>Apagada automàtica per inactivitat o temperatura</td>\n<td>Desactivar sleep a la configuració d'energia</td>\n</tr>\n</tbody>\n</table>\n<h2>12. Bones pràctiques</h2>\n<ul>\n<li><strong>Sempre</strong> accedir al PC de l'hort via Tailscale, mai per IP pública.</li>\n<li>Mantenir el router Parlem actualitzat (per seguretat i estabilitat).</li>\n<li>Configurar alertes via ntfy (quan <code>cyber-pi</code> existeixi) per si el PC<br>\n  de l'hort perd connectivitat.</li>\n<li>Fer còpies de seguretat del PC de l'hort periòdicament (veure<br>\n<a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-07-30-copies-seguretat.md\">CAP-07-30</a>).</li>\n<li>Rotar les claus SSH cada 90 dies.</li>\n<li>Documentar qualsevol canvi de xarxa (canvis d'IP al router Parlem) al<br>\n  fitxer privat <code>BernatCyberLab/_local/network/</code>.</li>\n</ul>\n<h2>13. Aspectes de seguretat</h2>\n<ul>\n<li>Cap port obert al router Parlem (CGNAT ja ho impossibilita; reforç).</li>\n<li>Cap port obert al router de casa (Tailscale evita aquesta necessitat).</li>\n<li>Tots els equips tenen tallafocs actiu.</li>\n<li>SSH al PC de l'hort amb claus (no contrasenyes), i prohibit root login.</li>\n<li>Tailscale amb MFA activat al compte.</li>\n<li>Sesions llargues amb timeout (evitar terminals oblidats oberts).</li>\n</ul>\n<h2>14. Automatització amb Hermes</h2>\n<p>Quan <code>cyber-brain</code> tingui Hermes (Fase 2+):</p>\n<ul>\n<li>Pot preguntar l'estat del lab hort-casa amb una sola consulta.</li>\n<li>Pot ajudar a generar ordres per reproduir una sessió des de casa.</li>\n<li>Pot documentar automàticament canvis de xarxa (canvis d'IP, etc.).</li>\n</ul>\n<p>Més detalls a <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-06-20-hermes.md\">CAP-06-20</a>.</p>\n<h2>15. Resum</h2>\n<ul>\n<li><strong>Dues ubicacions</strong>: hort (Parlem 5G/CGNAT) + casa.</li>\n<li><strong>5 equips</strong>: 2 a l'hort + 3 a casa + 1 pendent (futura <code>cyber-pi</code>).</li>\n<li><strong>Units per Tailscale</strong> sobre WireGuard.</li>\n<li><strong>Cap port obert</strong> a cap router.</li>\n<li><strong>El PC de l'hort és el cor del lab</strong> (Kali natiu + hipervisor).</li>\n<li><strong>El Mac potent de casa és el centre de control</strong> (des d'on es fan les<br>\n  pràctiques).</li>\n</ul>\n<h2>Referències</h2>\n<ul>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0001-arquitectura-general.md\">ADR/0001-arquitectura-general.md</a></li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0002-rolls-per-equip.md\">ADR/0002-rolls-per-equip.md</a></li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-04-10-tailscale.md\">CAP-04-10</a> — Tailscale</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/cap-08-20-kali-linux.md\">CAP-08-20</a> — Kali Linux</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/ann-05-xuleta-comandes.md\">ANN-05</a> — Xuleta de comandes</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/book/chapters/ann-07-historia-del-projecte.md\">ANN-07</a> — Història del projecte</li>\n</ul>"}, {"id": "docs-00-pla-director.md", "path": "docs/00-pla-director.md", "title": "Pla Director del Bernat CyberLab AI", "summary": "Construir un **laboratori personal de ciberseguretat**, completament legal, privat i orientat exclusivament a l'aprenentatge. Totes les pràctiques ofensives es limiten a **dispositius, màquines virtuals, contenidors i se", "category": "Pla Director", "html": "<h1>Pla Director del Bernat CyberLab AI</h1>\n<blockquote>\n<p>Document mestre. Defineix l'arquitectura, la governança, les fases i la metodologia.<br>\nSi tens dubtes, mira primer aquí.</p>\n</blockquote>\n<h2>0. Objectiu i abast</h2>\n<p>Construir un <strong>laboratori personal de ciberseguretat</strong>, completament legal, privat i orientat exclusivament a l'aprenentatge. Totes les pràctiques ofensives es limiten a <strong>dispositius, màquines virtuals, contenidors i serveis propis del laboratori</strong>. No es dissenyen ni s'automatitzen activitats dirigides contra sistemes de tercers.</p>\n<p>L'objectiu no és només instal·lar eines, sinó construir una <strong>plataforma estable, escalable i ben documentada</strong> que evolucioni durant anys.</p>\n<h2>1. Filosofia</h2>\n<ul>\n<li><strong>Modular</strong> — cada component té una responsabilitat clara.</li>\n<li><strong>Escalable</strong> — afegir VMs, contenidors o eines ha de ser trivial i documentat.</li>\n<li><strong>Documentat</strong> — cada decisió tècnica té una justificació escrita (ADR) i un procediment pas a pas.</li>\n<li><strong>Automatitzat</strong> — les tasques repetibles són scripts, no clics manuals.</li>\n<li><strong>Segur</strong> — principi de mínim privilegi, xifratge, aïllament de xarxa, autenticació multifactor.</li>\n<li><strong>Fàcil de mantenir</strong> — un altre tu (o un col·laborador) ha de poder reprendre el projecte en 6 mesos només llegint la documentació.</li>\n</ul>\n<h2>2. Maquinari i assignació de rols</h2>\n<table>\n<thead>\n<tr>\n<th>Dispositiu</th>\n<th>Nom al tailnet</th>\n<th>Rol</th>\n<th>Serveis principals</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PC Windows 11 (HP Z1 G9, 32 GB)</td>\n<td><code>cyber-host</code></td>\n<td>Host de virtualització + storage</td>\n<td>Hyper-V, WSL2, Docker, VMs, captures</td>\n</tr>\n<tr>\n<td>MacBook Pro 13\" (macOS 12.7.6)</td>\n<td><code>cyber-brain</code></td>\n<td>Cervell de serveis</td>\n<td>Hermes, Ollama, MCP, API, scripts</td>\n</tr>\n<tr>\n<td>Raspberry Pi 4</td>\n<td><code>cyber-pi</code></td>\n<td>Infraestructura lleugera</td>\n<td>AdGuard Home, Uptime Kuma, Tailscale SR, ntfy, Node-RED, WoL</td>\n</tr>\n<tr>\n<td>MacBook Air 13\" (macOS 26.5.2)</td>\n<td><code>cyber-control</code></td>\n<td>Consola humana</td>\n<td>Cap servei permanent</td>\n</tr>\n<tr>\n<td>iPhone 17</td>\n<td><code>cyber-mobile</code></td>\n<td>Consola mòbil</td>\n<td>Tailscale, Termius, notificacions</td>\n</tr>\n</tbody>\n</table>\n<p>Justificació detallada: <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0001-arquitectura-general.md\"><code>../ADR/0001-arquitectura-general.md</code></a> i <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0002-rolls-per-equip.md\"><code>../ADR/0002-rolls-per-equip.md</code></a>.</p>\n<h2>3. Arquitectura proposada</h2>\n<h3>Cervell del laboratori — <code>cyber-brain</code> (MacBook Pro)</h3>\n<ul>\n<li>Hermes Agent</li>\n<li>Ollama</li>\n<li>MCP servers</li>\n<li>API interna</li>\n<li>Base de coneixement</li>\n<li>Automatitzacions</li>\n<li>Tailscale</li>\n<li>Docker (lleuger)</li>\n<li>Repositori de configuració</li>\n</ul>\n<h3>Potència del laboratori — <code>cyber-host</code> (PC Windows)</h3>\n<ul>\n<li>Hyper-V (hipervisor natiu)</li>\n<li>Màquines virtuals (Kali, Ubuntu, Windows, AD lab)</li>\n<li>WSL2 + Docker Desktop</li>\n<li>Aplicacions vulnerables (DVWA, Juice Shop, ...)</li>\n<li>Captures de xarxa</li>\n<li>Snapshots</li>\n<li>Laboratoris d'Active Directory (aïllats)</li>\n</ul>\n<h3>Infraestructura lleugera — <code>cyber-pi</code> (Raspberry Pi)</h3>\n<ul>\n<li>Tailscale Subnet Router (opcional, controlat)</li>\n<li>AdGuard Home (DNS)</li>\n<li>Uptime Kuma (monitorització)</li>\n<li>Node-RED (automatitzacions)</li>\n<li>ntfy (notificacions)</li>\n<li>Watchdog</li>\n<li>Wake-on-LAN</li>\n</ul>\n<h3>Consola humana — <code>cyber-control</code> (MacBook Air)</h3>\n<ul>\n<li>VS Code</li>\n<li>SSH</li>\n<li>Navegador</li>\n<li>Escriptori remot</li>\n<li>Panell d'administració</li>\n<li>Documentació</li>\n</ul>\n<h3>Consola mòbil — <code>cyber-mobile</code> (iPhone)</h3>\n<ul>\n<li>Tailscale</li>\n<li>Termius / Blink (SSH)</li>\n<li>Notificacions</li>\n<li>Consulta ràpida</li>\n</ul>\n<h2>4. Xarxa</h2>\n<p>Xarxes previstes (veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/network/schema-adreces.md\"><code>../network/schema-adreces.md</code></a> per a placeholders):</p>\n<table>\n<thead>\n<tr>\n<th>Xarxa</th>\n<th>Rang</th>\n<th>Propòsit</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Xarxa domèstica</td>\n<td>(la que ja tinguis)</td>\n<td>Els teus equips personals</td>\n</tr>\n<tr>\n<td>Tailscale</td>\n<td><code>100.64.0.0/10</code></td>\n<td>Pla de gestió entre equips</td>\n</tr>\n<tr>\n<td>Gestió de VMs</td>\n<td><code>10.10.10.0/24</code></td>\n<td>Host ↔ VMs</td>\n</tr>\n<tr>\n<td>Xarxa ofensiva</td>\n<td><code>10.10.20.0/24</code></td>\n<td>Kali i eines d'atac</td>\n</tr>\n<tr>\n<td>Xarxa de víctimes</td>\n<td><code>10.10.30.0/24</code></td>\n<td>Màquines i apps vulnerables (sense Gateway)</td>\n</tr>\n<tr>\n<td>Xarxa defensiva</td>\n<td><code>10.10.40.0/24</code></td>\n<td>SIEM, sensors, IDS</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Normes clau:</strong><br>\n- Cap port obert al router domèstic.<br>\n- Les xarxes 10.10.x no es publiquen a Tailscale.<br>\n- Les màquines vulnerables no tenen Gateway per defecte.<br>\n- Hyper-V gestiona la segmentació amb vSwitch (Private / Internal / External).</p>\n<p>Detalls: <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0004-segmentacio-xarxa.md\"><code>../ADR/0004-segmentacio-xarxa.md</code></a> i <a href=\"#doc=architecture-topologia-xarxa.md\"><code>../architecture/topologia-xarxa.md</code></a>.</p>\n<h2>5. Accés remot (Tailscale)</h2>\n<ul>\n<li>Tots els dispositius amb Tailscale instal·lat.</li>\n<li>Subnet Router opcional a la RPi (només si cal accedir a la LAN des del tailnet, controlat).</li>\n<li>ACL estrictes (veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/network/tailscale.example.md\"><code>../network/tailscale.example.md</code></a>).</li>\n<li><strong>MFA</strong> activat al compte de Tailscale.</li>\n<li>Cap port obert al router — Tailscale és l'única porta.</li>\n</ul>\n<h2>6. Virtualització</h2>\n<p>Recomanació: <strong>Hyper-V</strong> al PC Windows 11 Pro. Veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0003-hipervisor-windows.md\"><code>../ADR/0003-hipervisor-windows.md</code></a>.</p>\n<h2>7. Màquines virtuals inicials (mínim viable)</h2>\n<ul>\n<li><strong>Atacant:</strong> Kali Linux (<code>kali-01</code>)</li>\n<li><strong>Servidor base:</strong> Ubuntu Server (<code>ubuntu-01</code>)</li>\n<li><strong>Víctima (una sola, Linux):</strong> Metasploitable 2 o similar (<code>target-linux-01</code>)</li>\n<li><strong>App web vulnerable (Docker):</strong> DVWA o Juice Shop (<code>target-web-01</code>)</li>\n<li>Windows de laboratori: <strong>més endavant</strong> (Fase 7)</li>\n<li>Active Directory: <strong>molt més endavant</strong> (Fase 8)</li>\n</ul>\n<h2>8. Docker</h2>\n<ul>\n<li>Al PC Windows via <strong>WSL2 + Docker Desktop</strong>.</li>\n<li>Les apps vulnerables viuen a la xarxa Docker <code>cyberlab_victim_net</code> (10.10.30.0/24).</li>\n<li>Cap port exposat a la xarxa domèstica.</li>\n</ul>\n<p>Veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/docker/README.md\"><code>../docker/README.md</code></a>.</p>\n<h2>9. Hermes com a director del laboratori</h2>\n<p>Hermes governa el laboratori amb <strong>principi de mínim privilegi</strong>. Veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/hermes/README.md\"><code>../hermes/README.md</code></a> per a capacitats actuals i previstes.</p>\n<h2>10. Base de coneixement i gestió de secrets</h2>\n<ul>\n<li>Base de coneixement: <a href=\"../knowledge-base/\"><code>../knowledge-base/</code></a> (writeups, errors, snippets).</li>\n<li><strong>Secrets:</strong> KeePassXC (ús diari) + <code>.env</code> xifrats amb <code>age</code> (serveis automatitzats).</li>\n<li>MAI cap secret en text pla al Git (ni tan sols <code>.env</code>).</li>\n<li>Veure <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0005-gestio-secrets.md\"><code>../ADR/0005-gestio-secrets.md</code></a> i <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/secrets-templates/README.md\"><code>../secrets-templates/README.md</code></a>.</li>\n</ul>\n<h2>11. Estructura de carpetes</h2>\n<p>Veure el <code>README.md</code> arrel per al detall complet.</p>\n<h2>12. Repositori Git</h2>\n<ul>\n<li><strong>Repo:</strong> <code>github.com/BernatMora/cyberlab-ai</code> (públic).</li>\n<li><strong>Llicència:</strong> doble — MIT (codi) + CC BY-SA 4.0 (docs).</li>\n<li><strong>Branques:</strong> <code>main</code> (protegida) + <code>develop</code> + <code>feature/*</code>, <code>fix/*</code>, <code>docs/*</code>, <code>experiment/*</code>.</li>\n<li><strong>Tags:</strong> versions per fase (<code>v0.0-bootstrap</code>, <code>v0.1-audit</code>, <code>v0.2-tailscale</code>, ...).</li>\n<li>Veure <a href=\"../../CONTRIBUTING.md\"><code>../../CONTRIBUTING.md</code></a> per a la política de commits i secrets.</li>\n</ul>\n<h2>13. Còpies de seguretat</h2>\n<ul>\n<li><strong>Restic</strong> + <strong>rclone</strong> per a còpies incrementals i deduplicades.</li>\n<li><strong>Discs externs</strong> (xifrats amb BitLocker) per a còpies locals.</li>\n<li><strong>Cloud xifrat</strong> (opcional, per a còpies off-site).</li>\n<li>Tipus de dades:</li>\n<li>Dades que es poden tornar a descarregar (no cal backup).</li>\n<li>Dades a copiar (documentació, scripts, configs, KeePassXC, captures).</li>\n<li>Dades a versionar (tot el que va al Git).</li>\n<li>Dades amb secrets (mai al Git, KeePassXC, <code>.env</code> xifrats).</li>\n<li>Dades temporals (volums Docker efímers — no cal backup).</li>\n</ul>\n<h2>14. Monitorització</h2>\n<ul>\n<li><strong>Uptime Kuma</strong> a la RPi (Fase 6).</li>\n<li>Alertes via <strong>ntfy</strong> (auto-hostat) → iPhone.</li>\n<li><strong>Glances</strong> opcional al PC per a CPU/RAM/temps.</li>\n<li>SIEM complet (Wazuh) → Fase 9.</li>\n</ul>\n<h2>15. Apagat i engegada remota</h2>\n<ul>\n<li><strong>Wake-on-LAN</strong> del PC: configurat a la BIOS/UEFI + comanda <code>etherwake</code> des de la RPi.</li>\n<li><strong>Apagat segur</strong> abans de qualsevol tall elèctric.</li>\n<li><strong>Engegada automàtica</strong> després d'un tall: configurar a la BIOS (\"Restore on AC Power Loss\" = \"Power On\").</li>\n<li>Com a últim recurs: endoll intel·ligent, <strong>mai</strong> per tallar l'alimentació.</li>\n</ul>\n<h2>16. Seguretat del laboratori</h2>\n<ul>\n<li>Comptes d'administració separats (no usar el compte personal per a serveis).</li>\n<li>Contrasenyes úniques, emmagatzemades a KeePassXC.</li>\n<li><strong>MFA</strong> activat a Tots els serveis que ho permetin (Tailscale, GitHub, etc.).</li>\n<li>Actualitzacions automàtiques al PC i a la RPi.</li>\n<li>Firewall activat per defecte.</li>\n<li>Xifratge de disc al PC (BitLocker) i a la RPi (LUKS).</li>\n<li>Claus SSH amb passphrase, generada amb <code>ed25519</code>.</li>\n<li>Tokens guardats a KeePassXC.</li>\n<li>Registre d'activitat (logs centralitzats a la RPi a partir de Fase 6).</li>\n<li><strong>Snapshot de recuperació</strong> abans de cada exercici important.</li>\n</ul>\n<h2>17. Sistema de noms</h2>\n<p>Veure <a href=\"#doc=architecture-convencions-noms.md\"><code>../architecture/convencions-noms.md</code></a>. Resum:</p>\n<ul>\n<li>Físics: <code>cyber-host</code>, <code>cyber-brain</code>, <code>cyber-pi</code>, <code>cyber-control</code>, <code>cyber-mobile</code>.</li>\n<li>VMs: <code>&lt;servei&gt;-NN</code> (<code>kali-01</code>, <code>ubuntu-01</code>, <code>target-linux-01</code>, ...).</li>\n<li>Serveis RPi: <code>cyber-dns</code>, <code>cyber-mon</code>, <code>cyber-nodered</code>, <code>cyber-ntfy</code>.</li>\n<li>Contenidors Docker: <code>&lt;servei&gt;-NN</code> (<code>dvwa-01</code>, <code>juice-shop-01</code>, ...).</li>\n</ul>\n<h2>18. Fases d'implantació</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Fase</th>\n<th>Sortida esperada</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>Auditoria de maquinari</td>\n<td>Inventari complet validat</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Xarxa i accés remot (Tailscale)</td>\n<td>Tailnet operatiu, ACL bàsiques, SSH validat</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Servidor Hermes (cyber-brain)</td>\n<td>Hermes + Ollama operatius, MCP bàsic, vault de secrets</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Virtualització al PC</td>\n<td>Hyper-V actiu, Kali + Ubuntu creats, xarxa aïllada</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Primer laboratori web (DVWA o Juice Shop)</td>\n<td>App vulnerable aïllada, primer exercici complet</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Automatització amb Hermes</td>\n<td>Hermes pot consultar estat, arrancar/aturar contenidors, generar missions</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Monitoratge</td>\n<td>Uptime Kuma + AdGuard Home + alertes, watchdog actiu</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Laboratoris Windows</td>\n<td>Windows vulnerable, pràctiques d'administració</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Active Directory</td>\n<td>Domini de laboratori aïllat, controlador + clients, pràctiques inicials</td>\n</tr>\n<tr>\n<td>9</td>\n<td>SIEM i defensa</td>\n<td>Wazuh/Security Onion, detecció, investigació</td>\n</tr>\n</tbody>\n</table>\n<p>Total estimat: 28-40 dies treballats (no seguits). Cada fase amb pausa per validar.</p>\n<h2>19. Metodologia obligatòria per fase</h2>\n<p>Cada fase ha de contenir:</p>\n<ol>\n<li><strong>Objectiu</strong> — què volem aconseguir.</li>\n<li><strong>Arquitectura afectada</strong> — quins components toquem.</li>\n<li><strong>Requisits previs</strong> — què ha de ser veritat abans de començar.</li>\n<li><strong>Programari necessari</strong> — eines concretes.</li>\n<li><strong>Passos exactes</strong> — numerats, reproduïbles.</li>\n<li><strong>Comandes</strong> — text exacte a executar.</li>\n<li><strong>Comprovacions</strong> — què verificar un cop executat cada pas.</li>\n<li><strong>Resultat esperat</strong> — l'estat final de la fase si tot va bé.</li>\n<li><strong>Errors habituals</strong> — amb solució.</li>\n<li><strong>Procediment de recuperació</strong> — com tirar enrere si alguna cosa falla.</li>\n<li><strong>Documentació que s'ha d'actualitzar</strong> — quins fitxers del repo canvien.</li>\n<li><strong>Criteri per considerar la fase completada</strong> — llista de comprovació final.</li>\n</ol>\n<p><strong>No s'avança a la següent fase fins que l'anterior estigui validada.</strong></p>\n<h2>20. Glossari</h2>\n<ul>\n<li><strong>Tailnet</strong> — la xarxa privada de Tailscale.</li>\n<li><strong>MagicDNS</strong> — DNS intern que resol noms de Tailscale sense configurar res.</li>\n<li><strong>vSwitch</strong> — switch virtual de Hyper-V (Private / Internal / External).</li>\n<li><strong>Hyper-V</strong> — hipervisor natiu de Windows 11 Pro.</li>\n<li><strong>WSL2</strong> — Windows Subsystem for Linux v2.</li>\n<li><strong>Ollama</strong> — motor de LLM local.</li>\n<li><strong>MCP</strong> — Model Context Protocol (per connectar eines a Hermes).</li>\n<li><strong>ADR</strong> — Architecture Decision Record.</li>\n<li><strong>SIEM</strong> — Security Information and Event Management.</li>\n<li><strong>IDS</strong> — Intrusion Detection System.</li>\n<li><strong>NIDS</strong> — Network IDS.</li>\n<li><strong>ACL</strong> — Access Control List.</li>\n<li><strong>SR</strong> — Subnet Router.</li>\n<li><strong>WoL</strong> — Wake-on-LAN.</li>\n</ul>\n<hr>\n<h2>proper pas</h2>\n<p>Quan hagis validat aquest document, comencem la <strong>Fase 0 — Auditoria de maquinari</strong>.<br>\nVes a <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/docs/10-fase-0-auditoria/README.md\"><code>10-fase-0-auditoria/README.md</code></a>.</p>"}, {"id": "architecture-topologia-xarxa.md", "path": "architecture/topologia-xarxa.md", "title": "Topologia de xarxa (versió pública, placeholders)", "summary": "```", "category": "Arquitectura", "html": "<h1>Topologia de xarxa (versió pública, placeholders)</h1>\n<blockquote>\n<p>⚠️ Aquest esquema usa <strong>adreces IP fictícies o anonimitzades</strong> (10.10.x.x).<br>\nLes IPs reals del teu entorn viuen a <code>BernatCyberLab/_local/network/local.md</code> (no versionat).</p>\n</blockquote>\n<h2>Visió general</h2>\n<pre><code>                    Internet\n                        │\n              [Router domèstic — cap port obert]\n                        │\n        ┌───────────────┴───────────────┐\n        │                               │\n   Xarxa domèstica                Tailscale tailnet\n   &lt;LAN&gt;/24 (existent)           100.64.0.0/10 (gestió)\n        │                               │\n        │  ┌────────────────┐           │\n        ├─►│ cyber-host     │◄──────────┤\n        │  │ (PC Win11)     │           │\n        │  │  Hyper-V       │           │\n        │  │  WSL2 + Docker │           │\n        │  │  vSwitch:      │           │\n        │  │   ├─ mgmt      │           │\n        │  │   ├─ ofensive  │           │\n        │  │   ├─ victim    │           │\n        │  │   └─ defense   │           │\n        │  └────────────────┘           │\n        │                               │\n        │  ┌────────────────┐           │\n        ├─►│ cyber-pi       │◄──────────┤\n        │  │ (RPi 4)        │           │\n        │  │  AdGuard Home  │           │\n        │  │  Uptime Kuma   │           │\n        │  │  Node-RED      │           │\n        │  │  ntfy          │           │\n        │  │  Tailscale SR  │           │\n        │  └────────────────┘           │\n        │                               │\n        │  ┌────────────────┐           │\n        ├─►│ cyber-brain    │◄──────────┤\n        │  │ (MBP 13&quot;)      │           │\n        │  │  Hermes        │           │\n        │  │  Ollama        │           │\n        │  │  MCP / API     │           │\n        │  └────────────────┘           │\n        │                               │\n   [cyber-control]              [cyber-mobile]\n   MBA — sense serveis          iPhone — només client\n</code></pre>\n<h2>Esquema d'adreces (públic)</h2>\n<table>\n<thead>\n<tr>\n<th>Xarxa</th>\n<th>Rang</th>\n<th>Propòsit</th>\n<th>Tailscale visible?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Xarxa domèstica</td>\n<td><code>&lt;LAN&gt;/24</code> (la que tinguis)</td>\n<td>Els teus equips personals</td>\n<td>no</td>\n</tr>\n<tr>\n<td>Gestió de VMs</td>\n<td><code>10.10.10.0/24</code></td>\n<td>Host ↔ VMs (accés SSH/administració)</td>\n<td><strong>no</strong></td>\n</tr>\n<tr>\n<td>Xarxa ofensiva</td>\n<td><code>10.10.20.0/24</code></td>\n<td>Kali i eines d'atac</td>\n<td><strong>no</strong></td>\n</tr>\n<tr>\n<td>Xarxa de víctimes</td>\n<td><code>10.10.30.0/24</code></td>\n<td>Màquines i apps vulnerables</td>\n<td><strong>no</strong></td>\n</tr>\n<tr>\n<td>Xarxa defensiva</td>\n<td><code>10.10.40.0/24</code></td>\n<td>SIEM, sensors, IDS</td>\n<td><strong>no</strong></td>\n</tr>\n<tr>\n<td>Tailscale</td>\n<td><code>100.64.0.0/10</code></td>\n<td>Pla de gestió entre equips</td>\n<td>sí</td>\n</tr>\n</tbody>\n</table>\n<h2>Xarxes Hyper-V (concepte)</h2>\n<p>Hyper-V distingeix tres tipus de vSwitch. Per a cada xarxa anterior:</p>\n<table>\n<thead>\n<tr>\n<th>Xarxa</th>\n<th>Tipus vSwitch</th>\n<th>Per què</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Gestió de VMs</td>\n<td>Internal</td>\n<td>Permet Host ↔ VMs, no exposa la xarxa domèstica</td>\n</tr>\n<tr>\n<td>Ofensiva</td>\n<td>Internal</td>\n<td>Aïllada del tràfic personal</td>\n</tr>\n<tr>\n<td>Víctimes</td>\n<td>Private</td>\n<td>Sense Gateway — totalment aïllada</td>\n</tr>\n<tr>\n<td>Defensa</td>\n<td>Internal</td>\n<td>Rep logs i alertes, aïllada de la resta</td>\n</tr>\n</tbody>\n</table>\n<h2>Mermaid (diagrama visual)</h2>\n<pre><code class=\"language-mermaid\">flowchart TB\n    Internet([Internet])\n    Router[Router domèstic&lt;br/&gt;cap port obert]\n    LAN[Xarxa domèstica&lt;br/&gt;&amp;lt;LAN&amp;gt;/24]\n    Tailscale[Tailscale tailnet&lt;br/&gt;100.64.0.0/10]\n\n    subgraph &quot;Xarxa de gestió (cyber-host)&quot;\n        Host[cyber-host&lt;br/&gt;PC Win11 + Hyper-V]\n    end\n\n    subgraph &quot;Xarxa domèstica (clients)&quot;\n        Brain[cyber-brain&lt;br/&gt;MBP 13&quot;]\n        Pi[cyber-pi&lt;br/&gt;RPi 4]\n        Ctrl[cyber-control&lt;br/&gt;MBA 13&quot;]\n        Mob[cyber-mobile&lt;br/&gt;iPhone]\n    end\n\n    Internet --&gt; Router --&gt; LAN\n    LAN --- Tailscale\n\n    LAN --&gt; Host\n    LAN --&gt; Brain\n    LAN --&gt; Pi\n    LAN --&gt; Ctrl\n    LAN --&gt; Mob\n\n    Host -. Tailscale .- Brain\n    Host -. Tailscale .- Pi\n    Brain -. Tailscale .- Pi\n    Mob -. Tailscale .- Host\n    Mob -. Tailscale .- Brain\n    Mob -. Tailscale .- Pi\n\n    style Host fill:#1f3a5f,stroke:#5fa8d3,color:#fff\n    style Brain fill:#5a3d1f,stroke:#d3a85f,color:#fff\n    style Pi fill:#1f5a3d,stroke:#5fd3a8,color:#fff\n    style Ctrl fill:#3a3a3a,stroke:#999,color:#fff\n    style Mob fill:#5a1f3d,stroke:#d35f99,color:#fff\n</code></pre>\n<h2>Regles d'accés (resum)</h2>\n<ul>\n<li><strong>cap port obert</strong> al router domèstic.</li>\n<li>Tailscale és l'única porta d'entrada des de fora de casa.</li>\n<li>Les xarxes 10.10.x <strong>no es publiquen</strong> al tailnet.</li>\n<li>Una màquina vulnerable no pot accedir a la xarxa domèstica.</li>\n<li>Una màquina vulnerable no té sortida a Internet per defecte (només si el host li dona NAT, controlat).</li>\n</ul>\n<h2>Fitxers relacionats</h2>\n<ul>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/network/tailscale.example.md\"><code>network/tailscale.example.md</code></a> — ACL i Subnet Router</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/network/firewall-rules.example.md\"><code>network/firewall-rules.example.md</code></a> — regles</li>\n<li><a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0004-segmentacio-xarxa.md\"><code>ADR/0004-segmentacio-xarxa.md</code></a> — decisió</li>\n<li><code>_local/network/local.md</code> — valors reals (no al Git)</li>\n</ul>"}, {"id": "architecture-convencions-noms.md", "path": "architecture/convencions-noms.md", "title": "Convencions de noms dels equips", "summary": "Adoptem noms curts, en minúscules, amb guions, sense espais ni caràcters especials.", "category": "Arquitectura", "html": "<h1>Convencions de noms dels equips</h1>\n<p>Adoptem noms curts, en minúscules, amb guions, sense espais ni caràcters especials.<br>\nTots els noms s'usen simultàniament a <strong>Tailscale</strong>, <strong>SSH</strong>, <strong>DNS</strong>, <strong>Docker</strong> i<br>\n<strong>documentació</strong>.</p>\n<h2>Convensió</h2>\n<ul>\n<li><code>cyber-&lt;rol&gt;</code> per als equips físics de gestió del laboratori.</li>\n<li><code>&lt;servei&gt;-&lt;nn&gt;</code> per a les màquines virtuals i contenidors.</li>\n<li>Sufix numèric de 2 dígits si n'hi ha més d'un (p. ex. <code>kali-01</code>, <code>kali-02</code>).</li>\n</ul>\n<h2>Dispositius físics</h2>\n<table>\n<thead>\n<tr>\n<th>Nom curt</th>\n<th>Dispositiu</th>\n<th>FQDN Tailscale</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>cyber-host</code></td>\n<td>PC Windows 11 (HP Z1 G9)</td>\n<td><code>cyber-host.tailnet</code></td>\n</tr>\n<tr>\n<td><code>cyber-brain</code></td>\n<td>MacBook Pro 13\" (macOS 12.7.6)</td>\n<td><code>cyber-brain.tailnet</code></td>\n</tr>\n<tr>\n<td><code>cyber-pi</code></td>\n<td>Raspberry Pi 4</td>\n<td><code>cyber-pi.tailnet</code></td>\n</tr>\n<tr>\n<td><code>cyber-control</code></td>\n<td>MacBook Air 13\" (macOS 26.5.2)</td>\n<td><code>cyber-control.tailnet</code></td>\n</tr>\n<tr>\n<td><code>cyber-mobile</code></td>\n<td>iPhone 17</td>\n<td><code>cyber-mobile.tailnet</code></td>\n</tr>\n</tbody>\n</table>\n<h2>Màquines virtuals</h2>\n<table>\n<thead>\n<tr>\n<th>Nom</th>\n<th>Funció</th>\n<th>FQDN Tailscale</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>kali-01</code></td>\n<td>Kali Linux (atacant)</td>\n<td><code>kali-01.tailnet</code></td>\n</tr>\n<tr>\n<td><code>ubuntu-01</code></td>\n<td>Ubuntu Server (base)</td>\n<td><code>ubuntu-01.tailnet</code></td>\n</tr>\n<tr>\n<td><code>win-lab-01</code></td>\n<td>Windows 10/11 vulnerable</td>\n<td><code>win-lab-01.tailnet</code></td>\n</tr>\n<tr>\n<td><code>target-linux-01</code></td>\n<td>Màquina Linux vulnerable (Metasploitable, etc.)</td>\n<td><code>target-linux-01.tailnet</code></td>\n</tr>\n<tr>\n<td><code>target-web-01</code></td>\n<td>App web vulnerable (DVWA / Juice Shop)</td>\n<td><code>target-web-01.tailnet</code></td>\n</tr>\n<tr>\n<td><code>win-dc-01</code></td>\n<td>Windows Server com a Domain Controller</td>\n<td><code>win-dc-01.tailnet</code> (Fase 8)</td>\n</tr>\n<tr>\n<td><code>defense-01</code></td>\n<td>SIEM / sensor</td>\n<td><code>defense-01.tailnet</code> (Fase 9)</td>\n</tr>\n</tbody>\n</table>\n<h2>Serveis a la Raspberry Pi (mateixa màquina, noms lògics diferents)</h2>\n<table>\n<thead>\n<tr>\n<th>Nom</th>\n<th>Funció</th>\n<th>Port intern</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>cyber-dns</code></td>\n<td>AdGuard Home</td>\n<td>53 (DNS), 3000 (UI)</td>\n</tr>\n<tr>\n<td><code>cyber-mon</code></td>\n<td>Uptime Kuma</td>\n<td>3001 (UI)</td>\n</tr>\n<tr>\n<td><code>cyber-nodered</code></td>\n<td>Node-RED</td>\n<td>1880 (UI)</td>\n</tr>\n<tr>\n<td><code>cyber-ntfy</code></td>\n<td>ntfy (notificacions)</td>\n<td>2586</td>\n</tr>\n</tbody>\n</table>\n<p>Tots viuen al <code>cyber-pi</code>. Els noms lògics permeten regles específiques a les<br>\nACL de Tailscale sense dependre de la IP.</p>\n<h2>Contenidors Docker al PC</h2>\n<table>\n<thead>\n<tr>\n<th>Nom</th>\n<th>Funció</th>\n<th>Port host</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>dvwa-01</code></td>\n<td>DVWA (web vulnerable)</td>\n<td>8080</td>\n</tr>\n<tr>\n<td><code>juice-shop-01</code></td>\n<td>OWASP Juice Shop</td>\n<td>8081</td>\n</tr>\n<tr>\n<td><code>portainer-01</code></td>\n<td>Portainer (gestió Docker)</td>\n<td>9443</td>\n</tr>\n<tr>\n<td><code>watchtower-01</code></td>\n<td>Watchtower (auto-update)</td>\n<td>n/a</td>\n</tr>\n</tbody>\n</table>\n<h2>Bones pràctiques</h2>\n<ul>\n<li><strong>Mai</strong> posar el nom real d'una persona a un nom d'equip.</li>\n<li><strong>Mai</strong> posar la ubicació geogràfica.</li>\n<li>Si una màquina canvia de rol, es rebateja (no s'afegeix un sufix <code>_v2</code>).</li>\n<li>Els noms es decideixen a <a href=\"https://github.com/BernatMora/cyberlab-ai/blob/main/ADR/0001-arquitectura-general.md\"><code>ADR/0001-arquitectura-general.md</code></a>.</li>\n</ul>"}, {"id": "architecture-diagram-general.md", "path": "architecture/diagram-general.md", "title": "diagram-general", "summary": "flowchart TB", "category": "Arquitectura", "html": "<p>flowchart TB<br>\n    Internet([Internet])<br>\n    Router[Router domèstic<br/>cap port obert]<br>\n    LAN[Xarxa domèstica<br/>&lt;LAN&gt;/24]<br>\n    Tailscale[Tailscale tailnet<br/>100.64.0.0/10]</p>\n<pre><code>subgraph Host[\"Xarxa de gestió (cyber-host)\"]\n    H[cyber-host&lt;br/&gt;PC Win11 + Hyper-V&lt;br/&gt;+ WSL2 Docker]\nend\n\nsubgraph Clients[\"Xarxa domèstica\"]\n    B[cyber-brain&lt;br/&gt;MBP 13]\n    P[cyber-pi&lt;br/&gt;RPi 4]\n    C[cyber-control&lt;br/&gt;MBA 13]\n    M[cyber-mobile&lt;br/&gt;iPhone]\nend\n\nsubgraph Labs[\"Xarxes de laboratori (10.10.x - no publicades al tailnet)\"]\n    V1[10.10.20 ofensiva&lt;br/&gt;kali-01]\n    V2[10.10.30 victimes&lt;br/&gt;target-linux-01&lt;br/&gt;target-web-01]\n    V3[10.10.40 defensa&lt;br/&gt;defense-01]\nend\n\nInternet --&gt; Router --&gt; LAN\nLAN --- Tailscale\nLAN --&gt; H\nLAN --&gt; B\nLAN --&gt; P\nLAN --&gt; C\nLAN --&gt; M\n\nH -. Tailscale .-&gt; B\nH -. Tailscale .-&gt; P\nB -. Tailscale .-&gt; P\nM -. Tailscale .-&gt; H\nM -. Tailscale .-&gt; B\nM -. Tailscale .-&gt; P\n\nH --&gt; Labs\n\nstyle H fill:#1f3a5f,stroke:#5fa8d3,color:#fff\nstyle B fill:#5a3d1f,stroke:#d3a85f,color:#fff\nstyle P fill:#1f5a3d,stroke:#5fd3a8,color:#fff\nstyle C fill:#3a3a3a,stroke:#999,color:#fff\nstyle M fill:#5a1f3d,stroke:#d35f99,color:#fff\n</code></pre>"}, {"id": "book-appendices-ann-05-xuleta-comandes.md", "path": "book/appendices/ann-05-xuleta-comandes.md", "title": "ANN-05 — Xuleta de comandes", "summary": "Aquest annex és una **referència ràpida**: per aprendre amb profunditat", "category": "Apèndixs", "html": "<h1>ANN-05 — Xuleta de comandes</h1>\n<blockquote>\n<p>Totes les ordres útils del laboratori, organitzades per categoria. <strong>Sempre<br>\namb placeholders</strong> (cap valor real). Aquesta xuleta té una versió PDF<br>\ngenerada automàticament pel projecte (veure <a href=\"../../scripts/cheatsheet/build-pdf.sh\"><code>scripts/cheatsheet/build-pdf.sh</code></a>).</p>\n</blockquote>\n<p>Aquest annex és una <strong>referència ràpida</strong>: per aprendre amb profunditat<br>\nqualsevol tema, consulta el capítol corresponent del llibre.</p>\n<hr>\n<h2>🐧 Ollama (al Mac potent de casa, quan s'instal·li)</h2>\n<pre><code class=\"language-bash\">ollama launch hermes --model &lt;MODEL_PLACEHOLDER&gt;\n</code></pre>\n<h2>💻 PowerShell (Windows — preparació ISO i USB)</h2>\n<h3>Verificar SHA256 d'una ISO</h3>\n<pre><code class=\"language-powershell\">Get-FileHash &quot;C:\\Users\\&lt;USER&gt;\\Downloads\\&
